<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="description" content="Aero 語音 × 認知教練：單字卡、測驗、語境短文閱讀、聽說練習、錯題診斷與星星獎卡，安裝後可離線使用。">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e3a5f">
<meta name="color-scheme" content="light">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aero 背單字">
<meta name="format-detection" content="telephone=no">
<title>互動背單字學習平台 ‧ Aero 語音 × 認知教練</title>
<style>
  :root{
    --ink:#1e3a5f; --sage:#4a90c2; --mist:#e4eef8; --mist-2:#cfe1f2;
    --cream:#f2f6fb; --paper:#fdfeff; --line:#cddcec;
    --coral:#d8604f; --coral-soft:#fbe4de; --gold:#e9a13b;
    --text:#1c2b3a; --muted:#64798f; --green-ok:#1e7a5a; --green-bg:#dff2ea;
    --aero:#3fb6e0; --aero-2:#7b6ef0; --aero-soft:#e0f4fc;
    --shadow:0 10px 28px rgba(30,58,95,.16); --shadow-sm:0 2px 10px rgba(30,58,95,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    background:radial-gradient(circle at 12% -5%,#fff 0,transparent 40%),
      radial-gradient(circle at 92% 8%,rgba(63,182,224,.16) 0,transparent 34%),
      radial-gradient(circle at 6% 96%,rgba(123,110,240,.10) 0,transparent 32%),var(--cream);
    color:var(--text);line-height:1.55;min-height:100vh;padding-bottom:92px}
  .en{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}

  header{background:linear-gradient(120deg,#16304f 0,#1e3a5f 48%,#2a5580 100%);color:#eaf2fb;
    padding-top:calc(14px + env(safe-area-inset-top));padding:16px 18px 14px;position:sticky;top:0;z-index:30;box-shadow:var(--shadow-sm)}
  .head-row{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:13px}
  .brand-aero{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:2px solid rgba(143,224,248,.55);
    background:linear-gradient(150deg,#fff,#cfeaf9);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;
    box-shadow:0 4px 14px rgba(63,182,224,.35);transition:.18s}
  .brand-aero:hover{transform:scale(1.07)}
  .titles h1 small{display:block;font-size:.6rem;font-weight:700;color:#9fbcd8;letter-spacing:1.6px;margin-top:1px}
  .titles h1{font-size:1.1rem;font-weight:800;letter-spacing:.5px}
  .titles select{margin-top:3px;background:#2b4d78;color:#d5e6f7;border:1px solid #3d6394;border-radius:7px;
    font-family:inherit;font-size:.74rem;font-weight:700;padding:3px 6px;max-width:200px}
  .ring{flex:0 0 auto;margin-left:auto;display:flex;align-items:center;gap:9px}
  @media(max-width:430px){
    .ring{gap:7px}
    .star-hud{padding:3px 7px;font-size:.68rem}
    .star-hud span{display:none}
    .head-row{gap:9px}
  }
  .streak{text-align:center;line-height:1.05}
  .streak .fire{font-size:1.2rem}
  .streak b{font-size:1rem;color:#fff;display:block}
  .streak span{font-size:.58rem;color:#9fbcd8;letter-spacing:.5px}
  .ringbox{display:flex;align-items:center;gap:9px}
  .ringbox .stat{text-align:right;line-height:1.1}
  .ringbox .stat b{font-size:.98rem;color:#fff}
  .ringbox .stat span{font-size:.6rem;color:#9fbcd8;letter-spacing:.5px}

  nav{max-width:860px;margin:13px auto 0;padding:6px 12px 0;display:flex;gap:3px;position:sticky;top:0;z-index:26;
    background:linear-gradient(180deg,var(--cream) 70%,transparent)}
  .tab{flex:1;border:none;cursor:pointer;font-family:inherit;background:var(--mist);color:var(--ink);
    padding:9px 1px;border-radius:12px 12px 0 0;font-size:.7rem;font-weight:700;
    border-bottom:3px solid transparent;transition:.18s}
  .tab .ico{font-size:1.05rem;display:block;line-height:1.2}
  .tab:hover{background:var(--mist-2)}
  .tab.active{background:var(--paper);border-bottom-color:var(--aero);color:var(--ink);box-shadow:var(--shadow-sm)}
  .tab.active .ico{filter:drop-shadow(0 2px 4px rgba(63,182,224,.45))}

  main{max-width:860px;margin:0 auto;padding:0 12px}
  .panel{display:none;background:var(--paper);border-radius:0 0 18px 18px;padding:20px 15px 80px;box-shadow:var(--shadow-sm);min-height:62vh}
  .panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;justify-content:center}
  .chip{border:1.5px solid var(--line);background:#fff;color:var(--muted);padding:6px 13px;border-radius:999px;
    font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
  .chip[data-f="review"] .dot{background:var(--coral)}
  .chip[data-f="known"] .dot{background:var(--sage)}

  /* flashcards */
  .card-stage{perspective:1400px;margin:0 auto;max-width:520px}
  .progress-mini{text-align:center;font-size:.78rem;color:var(--muted);font-weight:700;margin-bottom:10px}
  .progress-mini b{color:var(--coral)}
  .card{position:relative;width:100%;min-height:344px;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1)}
  .card.flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;
    padding:26px 24px;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
  .face .corner{position:absolute;top:0;right:18px;width:24px;height:30px;background:var(--gold);
    clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}
  .front{background:radial-gradient(circle at 50% 22%,#f2fbff 0,#fff 42%),linear-gradient(160deg,#fff 0,#f1f7fd 100%);align-items:center;justify-content:center;text-align:center}
  .num-badge{position:absolute;top:18px;left:20px;background:var(--ink);color:#fff;font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:8px}
  .tag-rel{position:absolute;top:18px;left:20px;background:var(--mist);color:var(--sage);font-size:.7rem;font-weight:800;padding:3px 9px;border-radius:8px;border:1px solid var(--mist-2)}
  .word{font-size:2.7rem;font-weight:800;color:var(--ink);margin-bottom:6px;word-break:break-word}
  .kk{font-size:1.02rem;color:var(--muted);font-weight:600;margin-bottom:18px}
  .speak-btn{border:none;background:var(--sage);color:#fff;width:54px;height:54px;border-radius:50%;font-size:1.4rem;cursor:pointer;box-shadow:var(--shadow-sm);transition:.15s;display:flex;align-items:center;justify-content:center}
  .speak-btn:hover{background:var(--ink);transform:scale(1.06)}
  .flip-hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:.74rem;color:var(--muted)}
  .back{background:linear-gradient(160deg,#fff 0,#ecf4fc 100%);transform:rotateY(180deg);overflow-y:auto}
  .back .b-word{font-size:1.5rem;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .back .b-word .mini-speak{border:none;background:var(--mist);color:var(--ink);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:.85rem}
  .pos{font-size:.95rem;color:var(--coral);font-weight:700;margin:8px 0 4px}
  .zh-def{font-size:1.02rem;color:var(--text);font-weight:600;margin-bottom:14px}
  .sec-label{font-size:.72rem;font-weight:800;color:var(--sage);letter-spacing:1.5px;margin:14px 0 6px}
  .phrase{font-size:.92rem;margin:3px 0;padding-left:4px}
  .phrase .pen{font-weight:700;color:var(--ink)}.phrase .pzh{color:var(--muted)}
  .ex{display:flex;gap:8px;margin:9px 0;font-size:.9rem}
  .ex .play{flex:0 0 auto;border:none;background:var(--coral-soft);color:var(--coral);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:.72rem;margin-top:1px}
  .ex .play:hover{background:var(--coral);color:#fff}
  .ex .etx .een{font-weight:600;color:var(--ink)}.ex .etx .ezh{color:var(--muted);font-size:.85rem}
  .rel-words{font-size:.88rem;color:var(--muted)}.rel-words b{color:var(--ink)}
  .tour-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
  .tour-btn{border:1.5px solid var(--sage);background:var(--paper);color:var(--ink);font-family:inherit;
    font-size:.86rem;font-weight:800;padding:9px 20px;border-radius:99px;cursor:pointer;transition:.15s;box-shadow:var(--shadow-sm)}
  .tour-btn:hover{background:var(--mist)}
  .tour-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tour-status{font-size:.74rem;font-weight:700;color:var(--sage);min-width:70px}
  .tour-on{background:var(--green-bg);border-radius:9px;
    box-shadow:0 0 0 4px var(--green-bg);transition:background .2s}
  .b-word.tour-on,.zh-def.tour-on,.pos.tour-on{background:var(--green-bg)}
  .controls{display:flex;align-items:center;gap:9px;margin-top:18px;max-width:520px;margin-left:auto;margin-right:auto}
  .nav-btn{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;color:var(--ink);width:46px;height:46px;border-radius:14px;font-size:1.2rem;cursor:pointer;font-family:inherit;transition:.15s}
  .nav-btn:hover{background:var(--mist);border-color:var(--sage)}.nav-btn:disabled{opacity:.35;cursor:default}
  .mark-btn{flex:1;border:none;padding:12px 4px;border-radius:14px;font-size:.92rem;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;box-shadow:var(--shadow-sm)}
  .mark-review{background:var(--coral-soft);color:var(--coral)}.mark-review:hover{background:var(--coral);color:#fff}
  .mark-known{background:var(--mist);color:var(--ink)}.mark-known:hover{background:var(--sage);color:#fff}
  .mark-btn.active-review{background:var(--coral);color:#fff}.mark-btn.active-known{background:var(--sage);color:#fff}
  .empty{text-align:center;color:var(--muted);padding:48px 20px;font-weight:600}.empty .big{font-size:2.4rem;margin-bottom:10px}

  /* list */
  .search-wrap{position:relative;margin-bottom:14px}
  .search-wrap input{width:100%;padding:12px 16px 12px 42px;border:1.5px solid var(--line);border-radius:13px;font-size:.95rem;font-family:inherit;background:#fff;color:var(--text)}
  .search-wrap input:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px rgba(122,155,142,.18)}
  .search-wrap::before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:.95rem;opacity:.6}
  .row{border:1px solid var(--line);border-radius:13px;margin-bottom:9px;background:#fff;overflow:hidden}
  .row.is-known{border-left:5px solid var(--sage)}.row.is-review{border-left:5px solid var(--coral)}
  .row-head{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer}
  .row-head .rw{font-size:1.18rem;font-weight:800;color:var(--ink)}
  .row-head .rk{font-size:.82rem;color:var(--muted)}
  .row-head .rz{font-size:.9rem;color:var(--text);flex:1;font-weight:600}
  .row-head .rsp{border:none;background:var(--mist);color:var(--ink);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:.9rem;flex:0 0 auto}
  .row-head .arr{flex:0 0 auto;color:var(--muted);transition:.2s;font-size:.85rem}
  .row.open .arr{transform:rotate(90deg)}
  .row-body{display:none;padding:0 15px 15px;border-top:1px solid var(--mist)}.row.open .row-body{display:block}
  @media (max-width:520px){.row-head .rz{flex:0 0 100%;order:5;margin-top:2px}}
  .pos-group{margin-bottom:16px}
  .pos-ghead{display:flex;align-items:center;gap:8px;margin:0 2px 8px;padding-bottom:6px;border-bottom:2px solid var(--mist-2)}
  .pos-gname{font-size:1rem;font-weight:800;color:var(--ink)}
  .pos-gcount{margin-left:auto;font-size:.74rem;font-weight:700;color:var(--muted);background:var(--mist);padding:2px 9px;border-radius:999px}

  /* quiz */
  .quiz-intro{text-align:center;padding:8px 4px 4px}
  .quiz-intro h2{font-size:1.18rem;color:var(--ink);margin-bottom:6px;text-align:center}
  .qsub{font-size:.8rem;font-weight:700;color:var(--sage);margin-bottom:14px}
  .qcfg{max-width:440px;margin:0 auto}
  .qcfg .lbl{font-size:.74rem;font-weight:800;color:var(--sage);letter-spacing:1px;text-align:left;margin:14px 0 7px}
  .seg{display:flex;gap:7px}
  .seg button{flex:1;border:1.5px solid var(--line);background:#fff;padding:11px 4px;border-radius:12px;font-family:inherit;font-weight:700;color:var(--ink);cursor:pointer;transition:.15s;font-size:.86rem}
  .seg button.sel{background:var(--ink);border-color:var(--ink);color:#fff}
  .start-quiz{width:100%;max-width:440px;margin:22px auto 0;display:block;border:none;background:var(--coral);color:#fff;padding:15px;border-radius:14px;font-family:inherit;font-weight:800;font-size:1rem;cursor:pointer;box-shadow:var(--shadow-sm)}
  .q-progress{height:8px;background:var(--mist);border-radius:999px;overflow:hidden;margin-bottom:16px}
  .q-progress i{display:block;height:100%;background:var(--sage);width:0;transition:.3s}
  .q-count{text-align:center;font-size:.8rem;color:var(--muted);font-weight:700;margin-bottom:12px}
  .q-prompt{background:var(--mist);border-radius:16px;padding:22px 16px;text-align:center;margin-bottom:16px}
  .q-prompt .ql{font-size:.72rem;font-weight:800;letter-spacing:1px;color:var(--sage)}
  .q-prompt .qw{font-size:1.9rem;font-weight:800;color:var(--ink);margin:6px 0;word-break:break-word}
  .q-prompt .qw.zh{font-size:1.4rem}.q-prompt .qw.phr{font-size:1.5rem}
  .q-prompt .qspeak{border:none;background:var(--paper);color:var(--ink);width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:1.1rem;margin-top:4px}
  .q-opts{display:grid;gap:9px}
  .opt{border:1.5px solid var(--line);background:#fff;padding:13px 15px;border-radius:13px;font-family:inherit;font-size:1rem;font-weight:600;color:var(--text);cursor:pointer;text-align:left;transition:.12s}
  .opt:hover{border-color:var(--sage);background:var(--mist)}
  .opt.correct{background:var(--green-bg);border-color:var(--sage);color:var(--green-ok)}
  .opt.wrong{background:var(--coral-soft);border-color:var(--coral);color:var(--coral)}
  .opt:disabled{cursor:default}
  .fb{margin-top:13px;border-radius:12px;padding:12px 14px;font-size:.9rem;display:none}
  .fb.show{display:block}
  .fb.ok{background:var(--green-bg);color:var(--green-ok)}
  .fb.no{background:var(--coral-soft);color:var(--coral)}
  .fb b{font-weight:800}
  .fb-audio{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .fb-play{border:1.5px solid currentColor;background:rgba(255,255,255,.72);color:inherit;
    font-family:inherit;font-size:.76rem;font-weight:800;padding:5px 11px;border-radius:99px;cursor:pointer;
    display:inline-flex;align-items:center;gap:4px;transition:.12s}
  .fb-play:hover{background:#fff}
  .fb-play:active{transform:scale(.95)}
  .fb-play.playing{background:currentColor}
  .fb-play.playing span{color:#fff}
  .q-next{width:100%;border:none;background:var(--ink);color:#fff;padding:14px;border-radius:14px;font-family:inherit;font-weight:800;font-size:.98rem;cursor:pointer;margin-top:14px;display:none}
  .q-next.show{display:block}

  /* ===== 遊戲化測驗介面 ===== */
  .g-bar{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .g-trophy{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:1.05rem;box-shadow:var(--shadow-sm);position:relative}
  .g-trophy.pulse{animation:gpulse .5s ease}
  @keyframes gpulse{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
  .g-track{flex:1;height:15px;border-radius:99px;background:var(--mist-2);position:relative;overflow:visible}
  .g-fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--sage),var(--green-ok));
    transition:width .45s cubic-bezier(.3,1.4,.5,1)}
  .g-star{position:absolute;top:50%;width:21px;height:21px;margin-left:-10.5px;transform:translateY(-50%);
    border-radius:50%;background:var(--mist);border:2px solid var(--line);color:#a9c0d8;
    display:flex;align-items:center;justify-content:center;font-size:.62rem;transition:all .35s}
  .g-star.on{background:var(--gold);border-color:#fff;color:#fff;box-shadow:0 0 0 3px rgba(212,162,78,.28)}
  .g-frac{position:absolute;left:9px;top:-16px;font-size:.66rem;font-weight:800;color:var(--ink)}
  .g-chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
  .g-chip{font-size:.7rem;font-weight:800;padding:3px 11px;border-radius:99px;background:var(--mist);color:var(--ink);white-space:nowrap}
  .g-chip.pts{background:var(--ink);color:var(--gold)}
  .g-chip.combo{background:var(--coral-soft);color:var(--coral)}
  .g-chip.combo.hot{animation:gpulse .45s ease}
  .g-chip.tag{background:transparent;color:var(--muted);font-weight:700}
  .g-float{position:fixed;left:50%;top:38%;transform:translateX(-50%);z-index:60;pointer-events:none;
    font-size:1.5rem;font-weight:900;color:var(--green-ok);text-shadow:0 2px 10px rgba(255,255,255,.9);
    animation:gfloat 1.05s ease-out forwards}
  .g-float.bad{color:var(--coral)}
  @keyframes gfloat{0%{opacity:0;transform:translateX(-50%) translateY(12px) scale(.7)}
    22%{opacity:1;transform:translateX(-50%) translateY(-6px) scale(1.12)}
    100%{opacity:0;transform:translateX(-50%) translateY(-58px) scale(1)}}
  .g-milestone{position:fixed;left:50%;top:44%;transform:translateX(-50%);z-index:61;pointer-events:none;
    background:var(--ink);color:#fff;padding:11px 22px;border-radius:99px;font-weight:800;font-size:.92rem;
    box-shadow:var(--shadow);animation:gmile 1.7s ease forwards;text-align:center}
  @keyframes gmile{0%{opacity:0;transform:translateX(-50%) scale(.75)}14%{opacity:1;transform:translateX(-50%) scale(1)}
    76%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(.94)}}
  .shake{animation:gshake .38s}
  @keyframes gshake{0%,100%{transform:translateX(0)}18%{transform:translateX(-7px)}38%{transform:translateX(6px)}
    60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  .rank-medal{width:88px;height:88px;margin:0 auto 8px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:2.3rem;font-weight:900;color:#fff;background:var(--sage);box-shadow:var(--shadow);animation:gpop .55s cubic-bezier(.3,1.5,.5,1)}
  .rank-medal.s{background:linear-gradient(140deg,var(--gold),#b8863a)}
  .rank-medal.a{background:linear-gradient(140deg,var(--sage),var(--green-ok))}
  .rank-medal.b{background:linear-gradient(140deg,#8fa8bd,#5f7c96)}
  .rank-medal.c{background:linear-gradient(140deg,#c4b39a,#9c8a6d)}
  @keyframes gpop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
  .g-stats{display:flex;gap:8px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap}
  .g-stat{background:var(--mist);border-radius:12px;padding:8px 14px;min-width:82px}
  .g-stat b{display:block;font-size:1.12rem;font-weight:900;color:var(--ink)}
  .g-stat span{font-size:.66rem;font-weight:700;color:var(--muted);letter-spacing:.5px}
  .result{text-align:center;padding:18px 8px}
  .result .score{font-size:3rem;font-weight:800;color:var(--ink)}.result .score small{font-size:1.2rem;color:var(--muted)}
  .result .msg{color:var(--sage);font-weight:700;margin:6px 0 18px;font-size:1.05rem}
  .wrong-list{text-align:left;max-width:480px;margin:0 auto 18px}
  .wrong-list .wl-h{font-size:.74rem;font-weight:800;color:var(--coral);letter-spacing:1px;margin-bottom:8px}

  /* speak */

  .sp-legend{font-size:.72rem;color:var(--muted);margin-top:10px;line-height:1.7}

  .sp-actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}

  .b-listen{background:var(--sage);color:#fff}.b-listen:hover{background:var(--ink)}
  .b-rec{background:var(--coral);color:#fff}.b-rec:hover{background:#b84c3c}

  .b-reveal{background:var(--mist);color:var(--ink)}.b-reveal:hover{background:var(--mist-2)}
  .b-replay{background:#fff;color:var(--ink);border:1.5px solid var(--line)!important}.b-replay:hover{background:var(--mist)}
  .sp-score{margin-top:16px;border-radius:14px;padding:14px;text-align:center;display:none}

  .sp-score.mid{background:#fbf2e0}.sp-score.mid .big{color:#b07d2a}
  .sp-score.low{background:var(--coral-soft)}.sp-score.low .big{color:var(--coral)}
  .sp-heard{font-size:.85rem;color:var(--muted);margin-top:6px}.sp-heard b{color:var(--ink)}
  .sp-note{font-size:.78rem;color:var(--muted);text-align:center;margin-top:12px;line-height:1.5}
  .sp-controls{display:flex;align-items:center;gap:10px;margin-top:16px;justify-content:center}
  .sp-playback{margin-top:16px;background:var(--mist);border-radius:14px;padding:13px 14px;display:none}

  /* me dashboard */
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:18px}

  .week{display:flex;gap:7px;justify-content:center;margin:14px 0 4px}

  footer{max-width:860px;margin:14px auto 0;padding:0 16px;text-align:center}

  @media (prefers-reduced-motion:reduce){.card{transition:none}.b-rec.recording{animation:none}}

  /* ===== 測驗強化 ===== */

  .mk-item{flex-wrap:wrap}

,{"id":"L2U37","title":"Level 2 ‧ Unit 37","words":[{"id":"fee","w":"fee","kk":"[fi]","num":1,"pos":"n.","zh":"服務費，費用","ph":[["a monthly membership fee","會員月費"]],"rel":"似 fare 交通費 ‧ a bus fare 公車費 ‧ a taxi fare 計程車費","ex":[["You have to pay a monthly membership fee to use this fitness center.","使用這家健身中心得先付會員月費。"]]},{"id":"luck","w":"luck","kk":"[lʌk]","num":2,"pos":"n.","zh":"好運，幸運","ph":[["by luck","只是運氣好"],["be in luck","很幸運，運氣很好"],["good luck to sb","祝某人好運"]],"rel":"衍 lucky 幸運的","ex":[["It was only by luck that we avoided the accident.","我們避免了這次意外只是運氣好而已。"],["You're in luck—we have one room still available.","你很幸運——我們還有一個空房間。"],["Good luck to you in your new job.","祝你的新工作順利。"]]},{"id":"fate","w":"fate","kk":"[fet]","relWord":2,"pos":"n.","zh":"命運","ph":[],"rel":"似 destiny 命運","ex":[["The board is going to have a meeting that will decide the fate of the company and its 500 employees.","董事會即將召開會議，決定這間公司及其 500 名員工的命運。"]]},{"id":"guard","w":"guard","kk":"[gɑrd]","num":3,"pos":"n. & vt.","zh":"警衛；警戒（不可數）；守衛，保護","ph":[["be on guard = stand guard","守衛"],["guard against...","防止……"]],"rel":"衍 guardian 守護者；監護人 ‧ bodyguard 保鑣","ex":[["The guard stopped us from going inside.","警衛不讓我們進去。"],["George was on guard at the front gate last night.","喬治昨晚在大門口守衛。"],["Bill kept a dog to guard his house.","比爾養了一隻狗看家。"],["Guard against pickpockets when you are shopping in the mall.","在商場購物時，要謹防扒手。"]]},{"id":"protect","w":"protect","kk":"[prəˈtɛkt]","relWord":3,"pos":"vt. & vi.","zh":"保護，防禦","ph":[["protect sb from / against...","保護某人免受……的傷害"]],"rel":"衍 protection 保護物；保護 ‧ 似 defend 防衛 ‧ 補 gangster 歹徒","ex":[["While riding a scooter, you should wear a helmet because it'll protect your head.","你騎機車時應該要戴安全帽，因為安全帽可以保護頭部。"],["Albert tried to protect his family from the gangsters.","亞伯特試著保護家人免受歹徒的傷害。"]]},{"id":"protective","w":"protective","kk":"[prəˈtɛktɪv]","relWord":3,"pos":"a.","zh":"保護的","ph":[["be protective of sb","保護某人，對某人呵護備至"]],"rel":"補 gear 裝備（集合名詞，不可數）","ex":[["A boxer can easily be hurt if he doesn't wear protective gear.","拳擊手要是不穿護具很容易就會受傷。"],["Some parents are too protective of their children.","有些父母過於保護他們的小孩。"]]},{"id":"satisfy","w":"satisfy","kk":"[ˈsætɪsˌfaɪ]","num":4,"pos":"vt.","zh":"使滿足；符合（要求、條件）","ph":[["satisfy, satisfied, satisfied","三態"],["satisfy / meet a requirement","符合要求"]],"rel":"衍 satisfying 令人愉悅／滿足的 ‧ satisfied 感到滿意的 ‧ satisfactory 令人滿意的 ‧ satisfaction 滿足，滿意 ‧ 反 dissatisfy 使不滿意","ex":[["That meal didn't satisfy me at all.","那頓飯一點都沒讓我吃飽。"],["The teacher we just interviewed seems to satisfy all requirements. = The teacher we just interviewed seems to meet all requirements.","我們剛剛面試的那位老師似乎符合所有的要求。"]]},{"id":"owner","w":"owner","kk":"[ˈonɚ]","num":5,"pos":"n.","zh":"所有者","ph":[],"rel":"衍 own 擁有；自己的；承認（own up to + V-ing 承認做……） ‧ ownership 所有權","ex":[["I am the owner of this land.","我是這塊地的所有人。"]]},{"id":"shelf","w":"shelf","kk":"[ʃɛlf]","num":6,"pos":"n.","zh":"（櫥櫃的或固定在牆上的）架子","ph":[["shelves","複數"],["clear a / one's shelf","把（某人的）架子清空"],["be left on the shelf","乏人問津"],["a shelf life","（食品的）保存期（限）"]],"rel":"","ex":[["Don't forget to clear your shelf when you move out.","你搬走時別忘了把你架子清空。"],["That philosophy book has been left on the shelf for years.","那本哲學書乏人問津，已經放在架上好幾年了。"],["This kind of cookie usually has a shelf life of six months.","這種餅乾的保存期通常是 6 個月。"]]},{"id":"drawer","w":"drawer","kk":"[ˈdrɔɚ]","relWord":6,"pos":"n.","zh":"抽屜","ph":[["a top / bottom drawer","最上／下面的抽屜"]],"rel":"衍 draw 拉","ex":[["The scissors are placed in the top drawer.","剪刀放在最上面的抽屜裡。"]]},{"id":"drug","w":"drug","kk":"[drʌg]","num":7,"pos":"n. & vt.","zh":"藥（物）；毒品；下藥（以使昏迷）","ph":[["drug, drugged, drugged","三態"],["take drugs","吃藥；吸毒"],["drug trafficking","毒品買賣"]],"rel":"衍 drugstore 藥妝店","ex":[["The drug is efficient in getting rid of a cold.","這個藥治療感冒很有效。"],["Andy has been taking drugs for high blood pressure for almost a year.","安迪已經吃高血壓的藥將近有一年了。"],["Never take drugs, or you'll be sorry for the rest of your life.","絕對不要吸毒，否則你會後悔一輩子。"],["Drug trafficking is illegal in almost every country.","幾乎在每一個國家毒品交易都是非法的。"],["Be careful! The juice might be drugged.","小心！這果汁可能被下藥。"]]},{"id":"cash","w":"cash","kk":"[kæʃ]","num":8,"pos":"n. & vt. & vi.","zh":"現金；兌現","ph":[["in cash","用現金"],["cash out...","……換成現金"]],"rel":"衍 cashier 出納員","ex":[["How much cash do you have with you?","你身上有多少現金？"],["Candy still prefers to pay in cash.","坎蒂仍然喜歡付現。"],["Can you cash this check for me?","能麻煩您將這張支票兌現嗎？"],["Robert cashed out his stocks and made a large profit.","羅伯特把他的股票兌現而獲得了巨額利潤。"]]},{"id":"coin","w":"coin","kk":"[kɔɪn]","relWord":8,"pos":"n. & vt.","zh":"硬幣；發明（新字詞）","ph":[["spin a coin","旋轉硬幣（用於猜測哪一面朝上）"],["toss a coin","擲硬幣決定"],["be two sides of the same coin = be different / opposite sides of the same coin","是（同）一件事情／一個問題的兩面"],["the other side of the coin","從另一方面來說，事情的另一面"]],"rel":"延伸 bill 鈔票；帳單 ‧ pay / foot a bill 付帳","ex":[["The beggar said, \"Can you spare me a few coins?\"","那乞丐說：『你能施捨我幾個硬幣嗎？』"],["I'll spin the coin, and you say \"heads\" or \"tails.\"","我來旋轉硬幣，然後你說『正面』或『反面』。"],["Let's toss a coin to see who has to clean the kitchen.","讓我們擲硬幣來決定誰必須打掃廚房。"],["Success and failure are actually two sides of the same coin.","成功和失敗實際上是同一件事情的兩面。"],["The work is easy, but the other side of the coin is it's low-paid.","這工作很輕鬆，但從另一方面來說工資卻很低。"],["The writer likes to coin new words in his novels.","這位作家喜歡在他的小說裡發明新字詞。"]]},{"id":"stranger","w":"stranger","kk":"[ˈstrendʒɚ]","num":9,"pos":"n.","zh":"陌生人","ph":[["Hello, stranger!","（用於稱呼熟人）你好，稀客！"],["be no stranger to sth","對某事物毫不陌生"]],"rel":"衍 strange 奇怪的","ex":[["Don't talk to strangers.","別和陌生人談話。"],["Hello, stranger! Long time no see!","你好，稀客！好久不見！"],["Lucy is no stranger to tennis.","露西對網球毫不陌生。"]]},{"id":"brain","w":"brain","kk":"[bren]","num":10,"pos":"n.","zh":"（頭）腦；智力；極聰明的人","ph":[["rack one's brains = beat one's brains","絞盡腦汁"],["use one's brain","用某人的腦子，動動某人的腦子"],["a brain drain","人才外流"]],"rel":"衍 brainpower 腦／智力 ‧ 似 intelligence 智力 ‧ intellect 智力","ex":[["Calvin's brain was damaged in the car accident.","凱文的腦部在該起車禍中受了傷。"],["Andrew racked his brains, trying to remember Becky's phone number.","安德魯絞盡腦汁想記起貝琪的電話號碼。"],["Use your brain, Darren. Don't just ask me to give you the answer directly.","用你的大腦，達倫。不要只要求我直接給你答案。"],["A brain drain is a problem for many poor countries.","人才外流是許多貧困國家的問題。"]]},{"id":"tongue","w":"tongue","kk":"[tʌŋ]","relWord":10,"pos":"n.","zh":"舌頭","ph":[["a mother / native tongue","母語"],["a slip of the tongue","口誤，不小心講錯"]],"rel":"","ex":[["The coffee was so hot that I burned my tongue.","咖啡太燙了，我舌頭都被燙到了。"],["Derek's mother tongue is French, not English.","德瑞克的母語是法文，不是英文。"],["Sorry, it must have been a slip of the tongue. I meant tomorrow, not today.","抱歉，可能是我不小心講錯了，我是指明天，不是今天。"]]},{"id":"climate","w":"climate","kk":"[ˈklaɪmɪt]","num":11,"pos":"n.","zh":"氣候（指某地長期的氣象型態）","ph":[["climate change","氣候變遷"]],"rel":"衍 climatic 氣候的 ‧ 似 climax 達到最高峰；頂點，最精彩的部分 ‧ weather 天氣（指某地短期的氣象型態）","ex":[["The climate on this island is generally very nice in autumn.","一般來說，這島上秋天的氣候非常舒適宜人。"],["Many countries are working together to combat climate change.","多國正在共同努力對付氣候變遷。"]]},{"id":"cloudy","w":"cloudy","kk":"[ˈklaʊdɪ]","relWord":11,"pos":"a.","zh":"多雲的，陰的","ph":[],"rel":"衍 cloud 雲 ‧ 似 overcast 陰天的，多雲的","ex":[["It's cloudy today. I'd better bring an umbrella.","今天是陰天。我最好還是帶把傘。"]]},{"id":"snowy","w":"snowy","kk":"[ˈsnoɪ]","relWord":11,"pos":"a.","zh":"下雪的","ph":[],"rel":"衍 snow 雪","ex":[["Dennis came to see me on a snowy night.","丹尼斯在一個下雪的夜晚來看我。"]]},{"id":"windy","w":"windy","kk":"[ˈwɪndɪ]","relWord":11,"pos":"a.","zh":"多風的","ph":[],"rel":"衍 wind 風","ex":[["It's too windy for a picnic.","風太大了，不適合野餐。"]]},{"id":"hike","w":"hike","kk":"[haɪk]","num":12,"pos":"n. & vi.","zh":"健行，遠足","ph":[["go on a hike = go hiking","去健行／遠足"],["hike up... = quickly raise...","快速拉起……"]],"rel":"衍 hiker 健行／遠足的人 ‧ hiking 健行，遠足 ‧ 似 walk 走 ‧ 補 lush 綠意盎然的","ex":[["We went on a hike to Sun Moon Lake last weekend.","我們上週末健行到日月潭。"],["I go hiking simply because I enjoy the lush countryside.","我健行純 inst the tide","不順應潮流"],["sink or swim","自生自滅，載浮載沉"],["go for a swim","去游泳"]],"rel":"","ex":[["Teddy wants to learn how to swim.","泰迪想學游泳。"],["Melody swam the River Eden.","美樂蒂游過了伊登河。"],["Just swim with the tide and vote for the proposal.","就順應潮流投票支持這提案吧。"],["Julie will never agree—she always swims against the tide.","茱莉永遠不會同意——她總是不順應潮流。"],["Harry complained that we left him to sink or swim.","哈利抱怨我們任他自生自滅。"],["Charlie went for a swim in the ocean in the morning.","查理早上去海裡游泳。"]]},{"id":"swimsuit","w":"swimsuit","kk":"[ˈswɪmsut]","relWord":17,"pos":"n.","zh":"游泳衣","ph":[],"rel":"","ex":[["Gordon lost weight, so he had to buy a new swimsuit.","戈登變瘦了，所以他得買件新泳衣。"]]},{"id":"surf","w":"surf","kk":"[sɝf]","relWord":17,"pos":"vi. & vt.","zh":"衝浪；上網","ph":[["surf the Net / net = surf / browse the internet","上網"]],"rel":"","ex":[["I learned how to surf while I was on vacation in Hawaii.","我在夏威夷度假時學會了衝浪。"],["Nancy spends her free time surfing the Net.","南西的休閒時間都用來上網。"]]},{"id":"seafood","w":"seafood","kk":"[ˈsiˌfud]","num":18,"pos":"n.","zh":"海鮮（不可數）","ph":[],"rel":"衍 sea 海（洋）","ex":[["George likes some seafood, such as salmon.","喬治喜歡一些如鮭魚等的海鮮。"]]},{"id":"runner","w":"runner","kk":"[ˈrʌnɚ]","num":19,"pos":"n.","zh":"跑者","ph":[["a drug runner","毒品販子"]],"rel":"衍 run 跑 ‧ runner-up 第 2 名，亞軍","ex":[["Andy is an excellent marathon runner.","安迪是位很優秀的馬拉松跑者。"],["James is playing the role of a drug runner in his latest movie.","詹姆士在他最新的電影裡是扮演一個毒品販子。"]]},{"id":"jog","w":"jog","kk":"[dʒɑg]","relWord":19,"pos":"vi. & n.","zh":"慢跑","ph":[["go jogging = go for a jog","去慢跑"]],"rel":"","ex":[["I go jogging along the riverbank every morning.","我每天早上沿著河岸慢跑。"],["My uncle goes for a one-hour jog every day.","我叔叔每天慢跑 1 個小時。"]]},{"id":"cloth","w":"cloth","kk":"[klɔθ]","num":20,"pos":"n.","zh":"布（料）（不可數）；（用於某特定用途的）布（可數）","ph":[["a piece of cloth","一塊布料"]],"rel":"衍 clothes 衣服（恆用複數） ‧ clothe 給……衣服穿（= dress）","ex":[["The tailor used two pieces of silk cloth to make that suit.","裁縫師傅用了 2 塊絲布料做那套西裝。"],["C  kinds of silver coins.","保羅喜歡收集不同的銀幣。"],["The man with silver hair over there is Kelly's grandfather.","那邊有位一頭銀髮的男士是凱莉的爺爺。"],["The politician was born with a silver spoon in his mouth.","這個政治人物生來就命好。"]]},{"id":"gold","w":"gold","kk":"[gold]","relWord":1,"pos":"n. & a.","zh":"黃金；黃金製的；金色的","ph":[["pure gold","純金"],["have a heart of gold","心地很善良"],["a gold coin","金幣"],["a gold ring","金戒指"]],"rel":"","ex":[["The watch is made of pure gold.","這支錶是純金打造的。"],["Mother Teresa had a heart of gold.","德雷莎修女的心地很善良。"],["Owen was surprised that there were so many gold coins in the box.","歐文驚訝地發現盒子裡竟然有這麼多金幣。"],["Juliet received a gold ring as her birthday present.","茱麗葉收到了一枚金戒指作為生日禮物。"],["The basketball players wore gold jackets.","那些籃球員穿金色夾克。"]]},{"id":"golden","w":"golden","kk":"[ˈgoldn]","relWord":1,"pos":"a.","zh":"黃金製的；金色的；極好的，有發展前途的","ph":[["a golden opportunity","大好／絕佳機會"]],"rel":"","ex":[["My grandmother asked me whether I had seen her golden necklace.","我奶奶問我有沒有看到她的金項鍊。"],["Sarah has beautiful golden hair.","莎拉有一頭美麗的金髮。"],["You should take up this golden opportunity.","你應要把握這大好機會。"]]},{"id":"wooden","w":"wooden","kk":"[ˈwʊdn]","relWord":1,"pos":"a.","zh":"木頭的；呆板的","ph":[],"rel":"衍 wood 木頭；樹林，森林 ‧ in the wood / woods 在樹／森林裡 ‧ woody 很多樹木的","ex":[["That wooden table has a very long history.","那張木桌子有很悠久的歷史。"],["The actor's performance in the movie was wooden.","這演員在那部電影的演出很呆板。"]]},{"id":"silent","w":"silent","kk":"[ˈsaɪlənt]","num":2,"pos":"a.","zh":"安／寂靜的；沉默的","ph":[["keep / stay silent","保持沉默"]],"rel":"似 quiet 安靜的","ex":[["The school is usually silent on Sundays.","學校星期天的時候通常很安靜。"],["No matter what your uncle asks, just keep silent.","不管你叔叔問什麼，保持沉默就好了。"]]},{"id":"silence","w":"silence","kk":"[ˈsaɪləns]","relWord":2,"pos":"n. & vt.","zh":"安／寂靜；沉默；使沉默","ph":[["in silence","靜靜地（做某事）"]],"rel":"","ex":[["The silence in the room made me very nervous.","房間裡鴉雀無聲，讓我很緊張。"],["Every night, we eat together in silence.","每晚，我們都靜靜地一起吃飯。"],["The sad news silenced all the children.","這悲傷的消息使 k":"[ˈmɛʒɚmənt]","relWord":17,"pos":"n.","zh":"測量；（量出來的）尺寸／大小等","ph":[["take measurements of...","測量……（的尺寸／大小等）"]],"rel":"","ex":[["The professor said, \"Objective measurement is very important in any experiment.\"","教授說：『客觀的測量在任何實驗中都非常重要。』"],["Jenny is taking measurements of the bed to see if it will fit in her room.","珍妮在量這張床，看看是否擺得進她房間。"]]},{"id":"length","w":"length","kk":"[lɛŋθ]","num":18,"pos":"n.","zh":"長度","ph":[["... in length","長為……"],["at length = in detail","詳細地"]],"rel":"衍 long 長的；長時間地 ‧ lengthen 使變長，加長 ‧ lengthy 冗長的","ex":[["This river is two kilometers in length. = This river is two kilometers long.","這條河長 2 公里。"],["Tell me at length what happened.","詳細告訴我發生了什麼事。"]]},{"id":"width","w":"width","kk":"[wɪdθ]","relWord":18,"pos":"n.","zh":"寬度","ph":[["... in width","寬為……"]],"rel":"衍 wide 寬闊的；寬的；很大地 ‧ widen（使）變寬","ex":[["The river is 120 feet in width. = The river is 120 feet wide.","這條河寬 120 英尺。"]]},{"id":"depth","w":"depth","kk":"[dɛpθ]","relWord":18,"pos":"n.","zh":"深度；（海洋或陸地的）深處（此意恆用複數）","ph":[["... in depth","深（度）為……"],["a man of great depth","很有深度的人"],["be out of one's depth","能力不及，無法了解"]],"rel":"衍 deep 深的；深沉的；深地 ‧ deepen（使）變深","ex":[["This lake reaches about 210 meters in depth.","這個湖泊深約 210 公尺。"],["The ring Emma threw sank into the depths of the sea.","艾瑪扔出去的戒指沉到了海底深處。"],["Tom's friends call him a man of great depth.","湯姆的朋友說他這個人很有深度。"],["Ken told me he was out of his depth in Ms. Smith's class.","肯告訴我他認為史密斯老師的課太難了。"]]},{"id":"upper","w":"upper","kk":"[ˈʌpɚ]","num":19,"pos":"a.","zh":"上方的，較高的","ph":[["an upper arm","上臂"],["upper management","上層管理階級"],["get / have the upper hand","占上風"]],"rel":"","ex":[["The motorcyclist's upper arms were badly injured in the accident.","這名摩托車騎士的上臂在這起意外中嚴重受傷。"],["The upper management has the power and responsibility to make important decisions.","上層管理階級有做重要決策的權力和責任。"],["In her relationship with Ray, Judy is always the one who has the upper hand.","在茱蒂和雷的交往關係裡，茱蒂總是占上風的一方。"]]},{"id":"lower","w":"lower","kk":"[ˈloɚ]","  sb/sth","對某人／事物造成損害"]],"rel":"衍 damaging 有害的 ‧ 似 harm 傷害 ‧ 反 benefit 利益；有益於","ex":[["Taking drugs does damage to one's body and mind. = Taking drugs does harm to one's body and mind.","吸毒有害身心。"],["The car was totally damaged in a traffic accident.","這輛車在一起交通事故中全毀了。"]]},{"id":"article","w":"article","kk":"[ˈɑrtɪkl]","num":3,"pos":"n.","zh":"（報章雜誌的）文章；一件物品（如衣物、傢俱等）","ph":[["an article of clothing / furniture = a piece of clothing / furniture","一件衣服／傢俱"]],"rel":"似 object 物品","ex":[["Have you read the article about climate change in the newspaper?","你看了報上那篇關於氣候變遷的文章了嗎？"],["Paul bought several articles of furniture recently.","保羅最近買了幾件傢俱。"]]},{"id":"essay","w":"essay","kk":"[ˈɛse]","relWord":3,"pos":"n.","zh":"（學生就某課程所寫的）論說文，短文；論文，專文（皆與介詞 on 或 about 並用）","ph":[],"rel":"","ex":[["Ms. Jones asked us to write an essay on any Victorian novel.","瓊斯老師讓我們寫一篇關於任何一本維多利亞時期小說的短文。"],["I'm planning to write an essay on global warming.","我正計劃要寫一篇有關全球暖化的論文。"]]},{"id":"deliver","w":"deliver","kk":"[dɪˈlɪvɚ]","num":4,"pos":"vt. & vi.","zh":"遞送，投遞；發表（演講）；生產，分娩；拯救","ph":[["deliver a speech / report","發表演講／報告"],["deliver sb from sth","拯救某人脫離某事"]],"rel":"衍 deliverance 拯救，救出（不可數） ‧ 似 send 寄","ex":[["The letter won't be delivered if you don't stick a stamp on the envelope.","如果不在信封上貼郵票，這封信就無法送達。"],["The president of the company delivers a speech to all employees every Monday morning.","每週一早上公司總裁都會對全體員工發表演講。"],["Tina's going to deliver her second baby tonight.","蒂娜今晚就要生第 2 胎了。"],["Years of hard work has finally delivered Sam from poverty.","山姆多年的努力使他終於能擺脫貧窮。"]]},{"id":"delivery","w":"delivery","kk":"[dɪˈlɪvərɪ]","relWord":4,"pos":"n.","zh":"遞送","ph":[["deliveries","複數"],["pay on delivery","貨到付款"],["take / accept delivery of sth","收到某物"]],"rel":"","ex":[["There is no mail delivery on Sundays.","星期天郵差不送信。"],["I haven't paid yet; I need to pay on delivery.","我還沒付款；我需要貨到付款。"],["Helen's neighbor took delivery of the package for her.","海倫的鄰居幫她代收包裹。"]]},{"id":"worth","w":"worth","kk":"[wɝθ]","num":5,"pos":"a. & n.","zh":"值（若干金額）的；值得（做）的；值（若干金額或時間）；價值，重要性","ph":[["be worth + N/V-ing","值得……"],["worth one's salt","稱職的"],["金額's / 時間's + worth of sth","價值若干金額的某事物／需花費若干時間的某事物（若金額為阿拉伯數字，則不加『's』）"]],"rel":"衍 worthy 值得的 ‧ worthwhile 值得（做）的 ‧ 補 punctuality 守時 ‧ coupon 禮券","ex":[["The painting is worth five million dollars.","這幅畫值 5 百萬美元。"],["The record is worth listening to again and again.","這張唱片值得一聽再聽。"],["Any worker worth his or her salt knows the importance of punctuality.","任何一個稱職的員工都知道守時的重要。"],["If you're lucky, you could get one thousand dollars' worth of coupons. = If you're lucky, you could get $1,000 worth of coupons.","幸運的話，可以獲得價值 1,000 元的禮券。"],["This is a book of real worth.","這是一本真正有價值的書。"]]},{"id":"willing","w":"willing","kk":"[ˈwɪlɪŋ]","num":6,"pos":"a.","zh":"願意的，情願的；自動自發的","ph":[["be willing to V","願意做……"]],"rel":"衍 will 意願 ‧ 反 unwilling 不願意的","ex":[["Sally is willing to help her mother with the chores.","莎莉願意幫母親做家事。"],["Diana and Gordon are both willing workers.","戴安娜和戈登都是很自動自發的員工。"]]},{"id":"advance","w":"advance","kk":"[ədˈvæns]","num":7,"pos":"vt. & vi. & n.","zh":"促進；前進，行進；進步；預付款","ph":[["make an advance","進步"],["give sb an advance","給某人預付款"],["an advance on sth","關於某物的預付款"],["in advance = beforehand","事先，預先"]],"rel":"衍 advanced 先進的；進階的；年紀大的","ex":[["The government has put a lot of effort to advance research on computer science.","政府花了很多心力促進電腦科學的研究。"],["The officer told the soldiers to advance.","那名軍官下令士兵前進。"],["We have not made great advances in the fight against AIDS.","我們在對抗愛滋病方面，並沒有很大的進步。"],["The boss gave me an advance on my next month's salary.","老闆讓我預支下個月的薪水。"],["Sean booked the hotel six months in advance.","尚恩提前 6 個月訂飯店。"]]},{"id":"brief","w":"brief","kk":"[brif]","num":8,"pos":"a. & n. & vt.","zh":"短暫的；（某事物）簡短的，簡潔的；（某人）簡明扼要的；概要；向……簡單說明","ph":[["a news brief","新聞摘要／簡報"],["in brief = in short","簡而言之"],["brief sb on sth","就某事向某人做簡報"]],"rel":"衍 briefcase 公事包 ‧ 似 short 短的","ex":[["Greg took a brief look at the newspaper before going to work.","葛瑞格在上班前迅速瀏覽了一下報紙。"],["The teacher asked us to write a brief summary of this article.","老師要求我們寫這篇文章的簡短摘要。"],["I know we're all in a hurry, so I'll be brief.","我知道我們的時間很趕，所以我會長話短說。"],["There's only a four-paragraph news brief on the event in the newspaper.","這份報紙上關於那事件的新聞摘要只有 4 段。"],["In brief, it's a job worth doing.","簡言之，這份工作值得做。"],["The commander briefed those soldiers on the nature of their mission.","指揮官向那些士兵就此次任務的性質做了簡單的說明。"]]},{"id":"cartoon","w":"cartoon","kk":"[kɑrˈtun]","num":9,"pos":"n. & vt.","zh":"（報紙等的）漫畫；（電視等的）卡通片；為……畫漫畫","ph":[],"rel":"","ex":[["Hank likes the political cartoons in the newspaper because they're really funny.","漢克喜歡報上的政治漫畫，因為它們真的很有趣。"],["I like to watch cartoons on TV.","我喜歡看電視卡通節目。"],["Mac cartooned the politician for the newspaper.","麥克幫報社畫該政客的漫畫。"]]},{"id":"comic","w":"comic","kk":"[ˈkɑmɪk]","relWord":9,"pos":"a. & n.","zh":"喜劇的；滑稽的；漫畫書（= a comic book）","ph":[["a comic strip","連環漫畫"]],"rel":"似 funny 滑稽的","ex":[["This comic writer has a talent for describing common events in a humorous way.","這位喜劇作家有用幽默的方式來呈現平凡事件的天分。"],["Jimmy delighted us all by singing a comic song.","吉米唱了一首很滑稽的歌，逗得大家都很開心。"],["Tim was punished for reading comics in class.","提姆上課時看漫畫書而遭到懲罰。"]]},{"id":"building","w":"building","kk":"[ˈbɪldɪŋ]","num":10,"pos":"n.","zh":"建築物，大樓","ph":[],"rel":"衍 build 興建","ex":[["This building has been here for more than 40 years.","這棟大樓屋齡已有 40 多年了。"]]},{"id":"roof","w":"roof","kk":"[ruf]","relWord":10,"pos":"n. & vt.","zh":"屋頂；給……蓋屋頂","ph":[["roofs","複數"],["under sb's roof","住在某人的家裡"],["be roofed with sth","用某物來做屋頂"]],"rel":"","ex":[["We need to get someone to fix the roof as soon as possible.","我們得盡快找人來修理屋頂。"],["When you're under my roof, you follow my rules.","你住我家時，就要遵守我的規定。"],["The shed is roofed with bamboo.","這棚屋的屋頂是用竹子做的。"]]},{"id":"ceiling","w":"ceiling","kk":"[ˈsilɪŋ]","relWord":10,"pos":"n.","zh":"天花板","ph":[["hit the ceiling / roof","大發雷霆，勃然大怒"]],"rel":"延伸 dome 圓屋頂","ex":[["The ceiling was painted white.","天花板被粉刷成白色。"],["Upon hearing that John had been kicked out of school, his father hit the ceiling.","約翰的父親一聽到他被學校開除就勃然大怒。"]]},{"id":"balcony","w":"balcony","kk":"[ˈbælkənɪ]","relWord":10,"pos":"n.","zh":"陽臺；（劇場的）包廂","ph":[["balconies","複數"]],"rel":"延伸 porch 走廊","ex":[["I planted some flowers on the balcony.","我在陽臺上種了一些花。"],["The balcony on the fifth floor has a good view of the entire stage.","5 樓的包廂有極佳的視野可以看到整個舞臺。"]]},{"id":"upset","w":"upset","kk":"[ʌpˈsɛt]","num":11,"pos":"a. & vt. & n.","zh":"難過的，沮喪的；使難過；爆冷門；難過，沮喪","ph":[["upset, upset, upset","三態同形"]],"rel":"似 unhappy 不悅的","ex":[["We were all upset when we heard the news.","我們得知這個消息時都很難過。"],["It upset Mary to have lost the race to her brother.","瑪麗賽跑輸給弟弟，令她很難過。"],["In a huge upset, Gary's team beat the former champions.","蓋瑞的隊伍打敗前次的冠軍，真是大爆冷門。"],["Dana's marriage problems were causing her great upset.","黛娜的婚姻問題使她很難過。"]]},{"id":"valuable","w":"valuable","kk":"[ˈvæljuəbl]","num":12,"pos":"a.","zh":"值錢的，貴重的；有價值的，有用的","ph":[],"rel":"衍 value 價值；評價 ‧ invaluable 無價的 ‧ 似 expensive 昂貴的 ‧ precious 貴重的 ‧ priceless 無價的（= invaluable） ‧ useful 有用的 ‧ helpful 有用的 ‧ 反 valueless 沒有價值的","ex":[["Gold is considered more valuable than silver.","一般認為黃金比白銀來得值錢。"],["I'd like to thank you for your valuable advice.","我很感謝你寶貴的意見。"]]},{"id":"custom","w":"custom","kk":"[ˈkʌstəm]","num":13,"pos":"n.","zh":"習俗；（個人的）習慣","ph":[["as be one's custom","是某人的習慣"]],"rel":"衍 customs 海關（恆用複數） ‧ customary 依據風俗的；依慣例的","ex":[["It is a Chinese custom for adults to give red envelopes to children during Chinese New Year.","大人過年給小孩紅包是華人的習俗。"],["Judy had breakfast in bed, as was her custom.","茱蒂在床上吃早餐，這是她的習慣。"]]},{"id":"per","w":"per","kk":"[pɝ]","num":14,"pos":"prep.","zh":"每……（年、人、公里等）","ph":[],"rel":"似 each 各自的；每個；各自地 ‧ every 每一","ex":[["The scenic spot attracts about 3 million visitors per year.","此旅遊景點每年吸引大約 3 百萬名觀光客。"]]},{"id":"goal","w":"goal","kk":"[gol]","num":15,"pos":"n.","zh":"目標","ph":[["achieve a goal","達成目標"]],"rel":"","ex":[["Maria achieved a goal of getting a master's degree.","瑪麗亞達成了取得碩士學位的目標。"]]},{"id":"aim","w":"aim","kk":"[em]","relWord":15,"pos":"vt. & vi. & n.","zh":"（使）瞄準；打算；瞄準；目標","ph":[["aim A at B","把 A 瞄準 B"],["aim at...","瞄準……"],["aim to V","打算做……"],["take aim at...","瞄準……"]],"rel":"衍 aimless 沒目標的 ‧ 補 retire 退休","ex":[["Tom aimed the stone at the thief.","湯姆把石頭瞄準小偷。"],["Although Ivan was aiming at the bird, he hit the tree.","艾凡雖然瞄準的是那隻鳥，卻打到了樹。"],["Richard aims to retire before he is fifty.","理查打算在 50 歲前退休。"],["That policeman took aim at the killer and shot him to death.","那警察瞄準了殺手並射殺了他。"],["My aim in life is to be a doctor and help the poor.","我人生的目標是當醫生來幫助窮人。"]]},{"id":"purpose","w":"purpose","kk":"[ˈpɝpəs]","relWord":15,"pos":"n.","zh":"目的","ph":[["for the purpose of + V-ing","為了做……"],["on purpose","故意地（= purposely）"],["to no purpose = in vain = to / of no avail","徒勞無功"]],"rel":"","ex":[["Jenny went to Austria for the purpose of studying music.","珍妮為了學音樂便到奧地利去了。"],["I can't believe Sarah hurt me on purpose.","我不敢相信莎拉會故意傷害我。"],["I tried to ask Ned to quit smoking, but to no purpose.","我設法要奈德戒菸，卻徒勞無功。"]]},{"id":"target","w":"target","kk":"[ˈtɑrgɪt]","relWord":15,"pos":"n. & vt.","zh":"（想要實現的）目標；靶子；以……為目標","ph":[["be targeted at...","以……為目標"]],"rel":"","ex":[["Our target this month is to produce at least four thousand cars.","我們本月的目標是要生產至少 4,000 輛車子。"],["Frank missed the target and hit the wall.","法蘭克沒打中靶子而是打到了牆上。"],["This new store is targeted at wealthy customers.","這家新開的店是以有錢的客戶為目標。"]]},{"id":"focus","w":"focus","kk":"[ˈfokəs]","relWord":15,"pos":"vt. & vi. & n.","zh":"（使）集中；焦點","ph":[["focuses / foci","複數"],["focus A on B","把 A 聚焦在 B 上"],["focus (one's attention) on... = concentrate (one's attention) on...","（某人）把注意力集中在……"],["the focus of attention","眾所矚目的焦點"]],"rel":"似 attention 注意","ex":[["Be quiet! I'm trying to focus my mind on this paper.","安靜點！我正設法集中心思在這份論文上。"],["I am so tired that I cannot focus on anything today.","我今天累死了，做什麼事都沒有辦法集中注意力。"],["Diana's beauty made her the focus of attention at the party ","relWord":18,"pos":"n.","zh":"判決；判斷力；看法，意見（= judgement〔英〕）","ph":[["in sb's judgment","依某人判斷"]],"rel":"","ex":[["The judgment was against the victim.","這次判決對受害者不利。"],["Don't ask me anymore. I trust your judgment.","不要再問我了。我相信你的判斷力。"],["In my judgment, Hank is a very good actor.","依我看來，漢克是一個非常好的演員。"]]},{"id":"justice","w":"justice","kk":"[ˈdʒʌstɪs]","relWord":18,"pos":"n.","zh":"公道，正義；司法審判","ph":[["a sense of justice","正義感"],["do sb/sth justice = do justice to sb/sth","為某人／事說公道話；公平對待某人／合理處理某事"],["bring sb to justice","將某人繩之以法"]],"rel":"衍 just 公平的 ‧ justify 證明……是合理的；使合理化","ex":[["A good judge should have a sense of justice.","好法官應有正義感。"],["To do Eliot justice, we must admit that he meant no harm.","為艾略特說句公道話，我們必須承認他無意傷害任何人。"],["Sheila's playing didn't do Beethoven's music justice.","席拉的演奏未能呈現貝多芬音樂的原貌。"],["The murderer must be arrested and brought to justice.","必須逮捕那兇手並將其繩之以法。"]]},{"id":"law","w":"law","kk":"[lɔ]","relWord":18,"pos":"n.","zh":"法律（體系）（不可數，前面常加定冠詞 the）；法則，定律","ph":[["obey / observe the law","守法"],["break the law","犯法"],["the laws of nature","自然法則"]],"rel":"衍 lawyer 律師 ‧ lawful 合法的，正當的 ‧ lawmaker 立法者 ‧ lawsuit 訴訟","ex":[["Everybody is equal before the law.","法律之前人人平等。"],["You must obey the law, or you will be punished.","你必須守法，不然會被處罰。"],["Rebecca would never dream of breaking the law.","蕾貝嘉從沒想過要犯法。"],["Human beings should follow the laws of nature.","人類應遵守自然法則。"]]},{"id":"legal","w":"legal","kk":"[ˈligl]","relWord":18,"pos":"a.","zh":"與法律相關的；合法的","ph":[["It is legal (for sb) to V","（某人）做……是合法的"]],"rel":"反 illegal 非法的 ‧ 補 betel nut 檳榔","ex":[["Henry went to the lawyer for legal help.","亨利去找律師尋求法律上的協助。"],["Is it legal for children to buy betel nuts in Taiwan?","在臺灣，兒童買檳榔合法嗎？"]]},{"id":"fair","w":"fair","kk":"[fɛr]","relWord":18,"pos":"a. & adv. & n.","zh":"公平的；相當多的；遵守規定地；露天遊樂場（= carnival）；（某類商品的）展銷會","ph":[["fair enough","這說得過去，有道理"],["by fair means or foul","不擇手段"],["play fair","按規則比賽／競爭"],["a book / craft fair","書展／手工藝展銷會"]],"rel":"衍 fairly 相當地，蠻 ‧ fairness 公正；公平","ex":[["It's not fair for you to speak ill of Jill, especially when she's your best friend.","你說吉兒壞話很不公平，尤其她還是你最好的朋友。"],["A: I'll do the dishes, and you'll mop the floor. B: Fair enough.","A：我洗碗，你拖地。B：這說得過去。"],["Linda has fair knowledge of Chinese kung fu.","琳達懂得不少中國功夫。"],["The coach wants the team to win by fair means or foul.","教練想要隊伍不擇手段贏得勝利。"],["Ricky didn't play fair in the game.","瑞奇沒有按規則比賽。"],["The children enjoyed all the rides at the fair very much.","這些小朋友很喜歡露天遊樂園的所有遊樂裝置。"],["Sally bought a handmade vase at the craft fair.","莎莉在手工藝展銷會買了一個手工花瓶。"]]},{"id":"anywhere","w":"anywhere","kk":"[ˈɛnɪˌ(h)wɛr]","num":19,"pos":"adv.","zh":"任何地方（= anyplace）","ph":[],"rel":"似 somewhere 某處","ex":[["Stop asking. I didn't go anywhere last night.","別問了。我昨晚哪兒也沒去。"]]},{"id":"anytime","w":"anytime","kk":"[ˈɛnɪˌtaɪm]","relWord":19,"pos":"adv.","zh":"任何時候","ph":[],"rel":"","ex":[["Call me anytime. I'm always home.","隨時打給我。我都在家。"]]},{"id":"anyway","w":"anyway","kk":"[ˈɛnɪˌwe]","relWord":19,"pos":"adv.","zh":"無論如何，還是，仍然","ph":[],"rel":"似 anyhow 無論如何","ex":[["It was raining, but Mary went out anyway.","那時候在下雨，但瑪麗還是出門了。"]]},{"id":"alike","w":"alike","kk":"[əˈlaɪk]","num":20,"pos":"a. & adv.","zh":"相似的；相似地；同樣地","ph":[["A and B alike = both A and B","A 以及 B"]],"rel":"似 similar 相像的 ‧ identical 同樣的","ex":[["The twins look so much alike that only their mother can tell them apart.","這對雙胞胎長得太相像了，只有他們的母親分辨得出來。"],["The teacher treated his students alike.","這位老師對待他的學生都一視同仁。"],["The strike is harmful to management and labor alike.","這場罷工對勞資雙方都同樣造成損失。"]]},{"id":"alive","w":"alive","kk":"[əˈlaɪv]","relWord":20,"pos":"a.","zh":"活著的","ph":[["be alive with...","充滿……"],["be alive to sth","意識到某事"]],"rel":"","ex":[["The police found two people alive at the scene of the car accident.","警方在車禍現場發現 2 名生還者。"],["The ocean is alive with all kinds of salt water creatures.","海洋裡充滿著各式各樣的鹽水生物。"],["The little girl wasn't alive to the danger.","那小女孩並未意識到危險。"]]}]},{"id":"L2U45","title":"Level 2 ‧ Unit 45","words":[{"id":"debate","w":"debate","kk":"[dɪˈbet]","num":1,"pos":"n. & vt. & vi.","zh":"辯論","ph":[["debate about / over...","針對……來辯論"]],"rel":"衍 debatable 可爭論的，未定論的 ‧ 似 argument 爭論 ‧ dispute 爭執 ‧ 補 abortion 墮胎","ex":[["After lengthy debate, the committee finally reached a conclusion.","經過冗長的爭論，委員會終於得出結論。"],["Daisy and I debated whether abortion should be made legal.","黛西和我為墮胎是否應該合法化而辯論。"],["Danny and Brandon debated over who was to blame for the mistake.","丹尼和布蘭登針對誰該為這個錯誤負責而辯論。"]]},{"id":"argue","w":"argue","kk":"[ˈɑrgju]","relWord":1,"pos":"vi.","zh":"爭執，爭論","ph":[["argue about / over...","爭論……"],["argue with sb","與某人爭論"]],"rel":"","ex":[["Will you kids stop arguing about whose toy that is?","你們這些孩子不要再爭吵那個玩具是誰的了，好嗎？"],["Don't argue with me, son. Just do as you are told.","別和我爭論，兒子。只要照我說的去做就好。"]]},{"id":"argument","w":"argument","kk":"[ˈɑrgjəmənt]","relWord":1,"pos":"n.","zh":"爭論","ph":[["have an argument with sb about / over sth","為了某事物和某人爭論"]],"rel":"","ex":[["Allen was having an argument with his wife about their children.","亞倫正為了孩子們的事和太太起爭執。"]]},{"id":"title","w":"title","kk":"[ˈtaɪtl]","num":2,"pos":"n. & vt.","zh":"頭銜；標題；為……加上標題","ph":[],"rel":"衍 entitle 給……命名","ex":[["Lauren's official title is Public Relations Director.","蘿倫的正式頭銜是公共關係部主任。"],["What's the title of the play we're going to see tomorrow?","我們明天要看的那場戲戲名是什麼？"],["This famous writer titled her latest novel Sunrise.","這位名作家為她的最新小說起名為《日出》。"]]},{"id":"mate","w":"mate","kk":"[met]","num":3,"pos":"n. & vt. & vi.","zh":"（動物的）配偶；配偶，情人；（使）交配","ph":[["mate A with / to B","使 A 和 B 交配"]],"rel":"似 partner 配偶，情人 ‧ spouse 配偶 ‧ lover 情人","ex":[["Female black widow spiders eat their mates.","雌的黑寡婦蜘蛛會吃掉牠們的配偶。"],["Rita told me Taylor was her ideal mate.","麗塔告訴我泰勒是她的理想伴侶。"],["Charlie mated his male donkey with a female one.","查理讓他的公驢和一匹母驢交配。"],["Many animals mate in spring.","很多動物在春天交配。"]]},{"id":"classmate","w":"classmate","kk":"[ˈklæsˌmet]","relWord":3,"pos":"n.","zh":"同班同學","ph":[],"rel":"衍 class 班級；課","ex":[["Linda asked a classmate whether she could borrow his pen.","琳達問同學說她是否可以借支筆。"]]},{"id":"friendship","w":"friendship","kk":"[ˈfrɛndʃɪp]","relWord":3,"pos":"n.","zh":"友誼","ph":[],"rel":"衍 friend 朋友 ‧ friendly 友善的 ‧ 補 hold... dear 非常在意……","ex":[["Sam will treasure / cherish / value your friendship forever. = Sam will hold your friendship dear forever.","山姆會永遠珍惜你的友誼。"]]},{"id":"shell","w":"shell","kk":"[ʃɛl]","num":4,"pos":"n.","zh":"貝殼，（海洋生物的）殼","ph":[["bring sb out of sb's shell","使某人不再害羞"]],"rel":"似 seashell（海）貝殼","ex":[["We collected shells at the beach.","我們在海邊收集貝殼。"],["Dancing has brought Tammy out of her shell.","跳舞讓泰咪變得不再害羞。"]]},{"id":"puzzle","w":"puzzle","kk":"[ˈpʌzl]","num":5,"pos":"n. & vt. & vi.","zh":"（遊戲的）謎；難以理解的事，謎；（使）困惑","ph":[["a crossword puzzle","填字遊戲"],["puzzle over sth","苦思某事"]],"rel":"衍 puzzled 困惑的 ‧ puzzling 令人困惑的 ‧ puzzlement 迷惑（不可數） ‧ 似 mystery 謎團；神祕 ‧ confusion 困惑；雜亂","ex":[["It took Eric four hours to solve the crossword puzzle.","艾瑞克花了 4 小時才解開這個字謎遊戲。"],["How pyramids were built is still a puzzle.","金字塔是如何建造的仍是個謎。"],["This question puzzles me a lot. Maybe I should ask the teacher.","這問題讓我很困惑。或許我該去問老師。"],["Jim has been puzzling over the math question for two days.","這數學問題讓吉姆苦思了 2 天。"]]},{"id":"pose","w":"pose","kk":"[poz]","num":6,"pos":"n. & vt. & vi.","zh":"姿勢；造成；擺姿勢（好讓人拍照或繪畫）","ph":[["in a(n) + adj. + pose","以……的姿勢"],["pose a threat to...","對……造成威脅"],["pose for a photo / picture","擺好姿勢拍照"]],"rel":"衍 poser 裝模作樣的人；難題","ex":[["The model sat in a sexy pose.","那個模特兒用性感的姿勢坐著。"],["Global warming is posing a threat to human survival.","全球暖化正對人類生存構成威脅。"],["The couple posed for wedding photographs.","這對情侶擺好姿勢要拍婚紗照。"]]},{"id":"position","w":"position","kk":"[pəˈzɪʃən]","relWord":6,"pos":"n. & vt.","zh":"位置；姿勢；地位；立場；職務；放置","ph":[["in a(n) + adj. + position","地處……的位置；以……的姿勢"],["hold a high position","位居要職"],["in sb's position","處在某人的情況"],["be in a position to V","有立場／資格做……"],["be in no position to V","沒立場／資格做……"]],"rel":"","ex":[["Our hotel is in a superb position overlooking the sea.","本飯店地處絕佳位置，可俯瞰海景。"],["Just relax and sit in a comfortable position.","只需放鬆並舒服地坐著。"],["My cousin holds a high position in the government.","我表哥在政府位居要職。"],["What would you do if you were in my position?","假如你處在我的情況下會怎麼做？"],["You're in no position to criticize others. You are at fault, too. = You're not entitled to criticize others. You are at fault, too.","你沒有資格批評他人。你也有錯。"],["This position pays a lot of money, but the work is hard.","這個職務待遇不錯，不過工作挺辛苦的。"],["Position these tomato plants on the right-hand side of the balcony.","將這些番茄植物放在陽臺的右側。"]]},{"id":"sidewalk","w":"sidewalk","kk":"[ˈsaɪdˌwɔk]","num":7,"pos":"n.","zh":"人行道〔美〕（= pavement〔英〕）","ph":[],"rel":"衍 side 面，邊；一方，觀點 ‧ 延伸 tunnel 隧道 ‧ underpass 地下道 ‧ overpass 天橋","ex":[["An artist is drawing on the sidewalk.","一位畫家正在人行道上作畫。"]]},{"id":"subway","w":"subway","kk":"[ˈsʌbˌwe]","relWord":7,"pos":"n.","zh":"地鐵〔美〕（= underground〔英〕= metro）","ph":[],"rel":"延伸 MRT 大眾捷運系統（為 Mass Rapid Transit 的縮寫）","ex":[["Shane takes the subway to work every day.","夏恩每天都搭地鐵上班。"]]},{"id":"whisper","w":"whisper","kk":"[ˈ(h)wɪspɚ]","num":8,"pos":"vt. & vi. & n.","zh":"低／耳語","ph":[["whisper sth in sb's ear","在某人耳邊悄悄說某事"],["whisper in / into sb's ear","在某人耳邊說悄悄話"],["in a whisper = in whispers","悄悄／小聲說"]],"rel":"衍 whispering 流言；呢喃","ex":[["Look! Natasha is whispering something in Taylor's ear again.","瞧！娜塔莎又在對泰勒說悄悄話了。"],["The little girl whispered in my ear, but I didn't really hear her.","那小女孩在我耳邊說悄悄話，但我其實沒聽到她說的話。"],["Jason and Linda were talking in a whisper. They're not speaking ill of me, are they?","傑森和琳達在小聲交談。他們不是在說我壞話，是吧？"]]},{"id":"china","w":"china","kk":"[ˈtʃaɪnə]","num":9,"pos":"n.","zh":"瓷器（集合名詞，不可數）","ph":[["like a bull in a china shop","是個莽撞的人，是個笨手笨腳的人"]],"rel":"似 China 中國 ‧ pottery 陶器（集合名詞，不可數） ‧ ceramics 陶瓷製品（恆用複數）","ex":[["Please be careful not to break any china.","請小心不要打破瓷器。"],["I don't want to invite Trevor to my party because he'll act like a bull in a china shop.","我不想邀請崔佛來我的派對，因為他會很莽撞。"]]},{"id":"rat","w":"rat","kk":"[ræt]","num":10,"pos":"n.","zh":"（大）老鼠","ph":[["smell a rat","覺得很可疑，察覺事有蹊蹺"]],"rel":"似 mouse 老鼠（複數為 mice）","ex":[["Martha screamed as she saw a rat in the kitchen.","瑪莎看到廚房有老鼠就尖叫了起來。"],["My husband has been coming home very late recently—I smell a rat!","我老公最近很晚才回家 —— 我覺得很可疑！"]]},{"id":"evil","w":"evil","kk":"[ˈivl]","num":11,"pos":"a. & n.","zh":"邪惡的；（氣味）難聞的；邪惡","ph":[],"rel":"似 devil 惡魔 ‧ wicked 邪惡的 ‧ malicious 惡意的","ex":[["Dragons are thought to be evil creatures in the West.","龍在西方世界裡被視為邪惡的生物。"],["My American friend doesn't like stinky tofu because he thinks it gives off an evil smell.","我的美國朋友不喜歡臭豆腐，因為他認為臭豆腐的味道很難聞。"],["The love of money is the root of all evil.","錢是萬惡之源。—— 諺語"]]},{"id":"found","w":"found","kk":"[faʊnd]","num":12,"pos":"vt.","zh":"建立，創辦","ph":[["found, founded, founded","三態"]],"rel":"比 find 發現 ‧ 三態為：find, found, found","ex":[["The United Nations was founded in 1945.","聯合國創立於西元 1945 年。"]]},{"id":"nearby","w":"nearby","kk":"[ˌnɪrˈbaɪ]","num":13,"pos":"a. & adv.","zh":"附近的；在附近","ph":[],"rel":"衍 near 近的；接近；在……附近 ‧ nearness 接近","ex":[["We went swimming at the beach and stayed at a nearby hotel.","我們去海邊游泳，並在附近一家旅館過夜。"],["Unfortunately, we had a flat tire, and there was no garage nearby.","很不幸我們的車爆胎了，且附近也沒有修車廠。"]]},{"id":"nearly","w":"nearly","kk":"[ˈnɪrlɪ]","relWord":13,"pos":"adv.","zh":"幾乎","ph":[],"rel":"似 almost 幾乎","ex":[["Mike was nearly hit by a car when he ran across the street toward the school bus.","麥克跑向對街的校車時差一點被車撞到。"]]},{"id":"ancient","w":"ancient","kk":"[ˈenʃənt]","num":14,"pos":"a.","zh":"古代的","ph":[],"rel":"反 modern 現代的","ex":[["The custom is derived from an ancient story.","這習俗源自於古代的一個故事。"]]},{"id":"insist","w":"insist","kk":"[ɪnˈsɪst]","num":15,"pos":"vt. & vi.","zh":"堅決要求；堅決認為，堅稱","ph":[["insist that + S + (should) + V","堅持要求……"],["insist that...","堅稱……"],["insist on + N/V-ing","堅決要求……；堅稱……"]],"rel":"衍 insistence 堅持","ex":[["Dad insists that I (should) go on a diet.","老爸堅持要我減肥。"],["The teacher insisted on er was studying in his room.","爸爸悄悄轉動門把，看看我弟弟是不是在房間裡讀書。"],["Kelly handled the emergency calmly and quickly.","凱莉冷靜快速地處理這起緊急事件。"],["The marked boxes must be handled with care.","那些做了記號的箱子搬動時要小心。"]]},{"id":"crisis","w":"crisis","kk":"[ˈkraɪsɪs]","num":24,"pos":"n.","zh":"危機","ph":[["crises","複數"],["handle a crisis = deal with a crisis = solve / resolve a crisis","處理危機"],["a financial crisis","金融危機"]],"rel":"","ex":[["The government handled the financial crisis quite well.","這次金融危機政府處置得相當不錯。"]]},{"id":"pound","w":"pound","kk":"[paʊnd]","num":25,"pos":"n. & vt. & vi.","zh":"英鎊（貨幣單位，縮寫為 £）（= pound sterling）；磅（重量單位，縮寫為 lb）；猛擊，連續重擊","ph":[["pound A on / against B","用 A 猛擊 B，用 A 連續重擊 B"]],"rel":"用法：pound sterling 之複數為 pounds sterling；lb 之複數為 lb / lbs。","ex":[["This cellphone is only 30 pounds. = This cellphone is only £30.","這支手機僅售 30 英鎊。"],["The box weighs 10 pounds. = The box weighs 10 lbs.","這箱子重達 10 磅。"],["An ounce of prevention is worth a pound of cure.","一盎司的預防等於一磅的治療／預防勝於治療。—— 諺語"],["Andrew suddenly pounded his fist on the table and scared all of us.","安德魯突然用拳頭猛擊桌子，嚇到了我們所有的人。"],["Two policemen were pounding at my neighbor's door.","兩個警察正在不停地大力敲我鄰居的門。"]]},{"id":"leadership","w":"leadership","kk":"[ˈlidɚˌʃɪp]","num":26,"pos":"n.","zh":"領導（地位）；領導能力（皆不可數）","ph":[["under sb's leadership","在某人的領導下"]],"rel":"衍 lead 帶領 ‧ leader 領袖","ex":[["Jenny believes things will get better under the new manager's leadership.","珍妮相信在新任經理的領導下，情況將會有所改善。"],["Patrick was known for his courage and leadership.","派翠克以他的勇氣和領導能力聞名。"]]},{"id":"solve","w":"solve","kk":"[sɑlv]","num":27,"pos":"vt.","zh":"解決；解（題）","ph":[["solve a problem = resolve a problem","解決問題"]],"rel":"似 resolve 解決","ex":[["Money alone cannot solve all your problems.","光靠錢不能解決你所有的問題。"],["Matthew is not good at solving math problems.","馬修不太擅長解數學題。"]]},{"id":"solution","w":"solution","kk":"[səˈluʃən]","relWord":27,"pos":"n.","zh":"解決辦法；答案；溶液","ph":[["a solution to sth","某事物的解決辦法；某事物的答案"]],"rel":"","ex":[["The solution to the conflict between the two nations has yet to be found.","該兩國間衝突的解決之道仍有待探求。"],["The solutions to the puzzles are at the back of the book. = The answers to the puzzles are at the back of the book.","這些謎語的答案在書的最後面。"],["Whenever I have a sore throat, my mom asks me to clean my throat with a salt solution.","每當我喉嚨痛時，我媽都要我用鹽水清潔我的喉嚨。"]]},{"id":"impressive","w":"impressive","kk":"[ɪmˈprɛsɪv]","num":28,"pos":"a.","zh":"令人印象深刻的，壯觀的","ph":[],"rel":"似 imposing 壯觀的","ex":[["Tiffany found the pianist's performance most impressive.","蒂芬妮覺得這位鋼琴家的演奏最令人印象深刻。"]]},{"id":"require","w":"require","kk":"[rɪˈkwaɪr]","num":29,"pos":"vt.","zh":"要求；需要","ph":[["require that S + (should) + V","要求……"],["be required to V","被要求做……，必須要做……"],["require + V-ing","需要做……"]],"rel":"衍 required 必須的","ex":[["Karl's parents required that he clean his own room.","卡爾的父母要求他打掃自己的房間。"],["Everyone is required to wear a uniform to the ceremony.","每個人都必須穿制服參加典禮。"],["The machine required fixing.","這臺機器需要修理。"]]},{"id":"requirement","w":"requirement","kk":"[rɪˈkwaɪrmənt]","relWord":29,"pos":"n.","zh":"要求，必要條件","ph":[["meet a requirement","達到要求"]],"rel":"","ex":[["It's hard for Michael to meet the requirements of the job.","對麥可而言，符合這工作的需求很難。"]]}]},{"id":"L2U46","title":"Level 2 ‧ Unit 46","words":[{"id":"instant","w":"instant","kk":"[ˈɪnstənt]","num":1,"pos":"n. & a.","zh":"頃刻；立即的（= immediate）；即食／溶的","ph":[["for an instant","那一瞬間，有那麼一會兒"],["in an instant","馬上，立刻，瞬間"],["instant noodles / coffee / soup","泡麵／即溶咖啡／即溶湯品"]],"rel":"似 immediate 立即的","ex":[["As Jason heard the gunshots, for an instant he froze and his mind went blank.","傑森聽到槍聲時，一瞬間僵住了，腦子也一片空白。"],["Kelly said she would pick me up in an instant.","凱莉說她會馬上來接我。"],["Henry received an instant response from the company.","亨利收到了那家公司的立即回覆。"],["Don't eat instant noodles too often, as they're not good for your health.","不要太常吃泡麵，因為它們對你的健康並不好。"]]},{"id":"instance","w":"instance","kk":"[ˈɪnstəns]","relWord":1,"pos":"n.","zh":"例子","ph":[["for instance / example","舉例來說"]],"rel":"","ex":[["Sandra has a lot of work to do. For instance, she has to clean the kitchen.","珊卓有很多工作要做。比如說，她必須打掃廚房。"]]},{"id":"sudden","w":"sudden","kk":"[ˈsʌdn]","relWord":1,"pos":"a. & n.","zh":"突然的；突然發生的事","ph":[["all of a sudden = suddenly","突然間"]],"rel":"似 abrupt 突然的","ex":[["There was a sudden change in the weather.","天氣突然起了變化。"],["All of a sudden, a loud noise outside our window disturbed our sleep.","突然窗外一聲巨響，打斷了我們的睡眠。"]]},{"id":"furniture","w":"furniture","kk":"[ˈfɝnɪtʃɚ]","num":2,"pos":"n.","zh":"傢俱（集合名詞，不可數）","ph":[["a piece of furniture","一件傢俱"],["a lot of furniture","許多傢俱"]],"rel":"用法：a furniture（✗）、a lot of furnitures（✗）皆為錯誤用法。","ex":[["This piece of furniture Paul bought last week is said to have a long history.","保羅上星期買的這件傢俱據說歷史悠久。"]]},{"id":"curtain","w":"curtain","kk":"[ˈkɝtn]","relWord":2,"pos":"n. & vt.","zh":"窗簾；（舞臺上的）布幕；給……裝窗簾","ph":[["draw / close / pull the curtains","拉上窗簾"],["draw back the curtains = open the curtains","拉開窗簾"],["curtain off sth","用簾子遮住某物"]],"rel":"似 drapes 窗簾，帷幕（恆用複數） ‧ 補 dress 包紮處理（傷口）","ex":[["Can I draw the curtains? The sun is too bright.","我可以拉上窗簾嗎？太陽太大了。"],["Katie drew back the curtains to reveal a sunny day outside.","凱蒂拉開窗簾，露出外面的晴天。"],["Katie started to sing after the curtain opened.","舞臺上的布幕拉開後，凱蒂就開始唱歌。"],["Donald curtained the windows of the building so that no one could see inside.","唐諾給這棟建物的窗戶裝上了窗簾，這樣就沒有人可以看到裡面了。"],["The nurse curtained off Nathan's bed completely and then cleaned and dressed his wound.","護士將納森的床的周圍完全拉上窗簾，然後清洗包紮他的傷口。"]]},{"id":"mat","w":"mat","kk":"[mæt]","relWord":2,"pos":"n.","zh":"墊子","ph":[],"rel":"衍 doormat 門前的地墊","ex":[["Mom put a mat in front of the door.","媽媽在門口擺了一張墊子。"]]},{"id":"following","w":"following","kk":"[ˈfɑloɪŋ]","num":3,"pos":"prep. & n. & a.","zh":"在……之後；接下來的人／事／物；接著的","ph":[["The following is + 單數可數名詞","以下是……"],["The following are + 複數可數名詞","以下是……"]],"rel":"衍 follow 跟隨；遵從；理解（= understand）；在……之後發生 ‧ follower 追隨者；擁護者 ‧ 反 previous 之前的","ex":[["Following the film, there will be an interview with the director.","電影結束之後，將會對導演進行訪談。"],["The following is a list of common errors found in student compositions.","以下是在學生作文中常發現的錯誤列表。"],["The following are the winners of this game: Mike, Sue, and Jeff.","以下是這場比賽的優勝者：麥克、蘇和傑夫。"],["Steve arrived on Thursday and left the following day.","史提夫星期四抵達，隔天就離開了。"]]},{"id":"praise","w":"praise","kk":"[prez]","num":4,"pos":"n. & vt.","zh":"讚美","ph":[["in praise of...","讚美……"],["praise... for + N/V-ing","因……讚美……"]],"rel":"反 criticism 批評 ‧ criticize 批評","ex":[["Daniel gave a speech in praise of the success of the new products.","丹尼爾發表演講，稱讚新產品很成功。"],["The teacher praised the little boy for his courage.","老師讚許這小男孩很有勇氣。"]]},{"id":"cancel","w":"cancel","kk":"[ˈkænsl]","num":5,"pos":"vt.","zh":"取消","ph":[],"rel":"衍 cancellation 取消 ‧ 似 call... off 取消／中止……","ex":[["We canceled the meeting because of the typhoon.","我們因颱風天而取消了會議。"]]},{"id":"asleep","w":"asleep","kk":"[əˈslip]","num":6,"pos":"a.","zh":"睡著的","ph":[["fall asleep","睡著"]],"rel":"衍 sleep 睡覺 ‧ 反 awake 醒著的","ex":[["The guard fell asleep while he was on duty last night.","守衛昨晚值班時睡著了。"]]},{"id":"sleepy","w":"sleepy","kk":"[ˈslipɪ]","relWord":6,"pos":"a.","zh":"想睡的","ph":[["be / feel sleepy","覺得很睏，想睡覺"]],"rel":"","ex":[["Wesley felt sleepy after finishing all that work.","把所有的工作做完後衛斯理覺得很睏。"]]},{"id":"dot","w":"dot","kk":"[dɑt]","num":7,"pos":"n. & vt.","zh":"小點；布滿，散布","ph":[["dot, dotted, dotted","三態"],["on the dot","準時"],["be dotted with...","布滿著……，有很多……"]],"rel":"似 spot（斑）點","ex":[["We watched the balloon flying away until it became a dot.","我們看著氣球飛走，直到它變成一個小點為止。"],["It's nine o'clock on the dot. = It's nine o'clock sharp. = It's nine o'clock exactly.","現在是 9 點整。"],["The night sky was dotted with shining stars.","夜空布滿著閃爍的星星。"]]},{"id":"alarm","w":"alarm","kk":"[əˈlɑrm]","num":8,"pos":"vt. & n.","zh":"使恐慌，使擔心；警報器；鬧鐘","ph":[["set off an alarm","觸動警報器"],["a fire alarm","火災警報器"],["an alarm (clock)","鬧鐘"]],"rel":"似 frighten 使害怕","ex":[["I didn't want to alarm our grandmother so I didn't tell her that my mother was sick.","我不想驚動我外婆，所以我沒有告訴她我母親生病了。"],["The guards said they still had no idea what set off the fire alarm in this building.","守衛說他們仍不知道是什麼觸動了這座大樓的火災警報器。"],["The alarm clock went off at seven.","鬧鐘在 7 點鐘響起。"]]},{"id":"childish","w":"childish","kk":"[ˈtʃaɪldɪʃ]","num":9,"pos":"a.","zh":"幼稚的（貶義）","ph":[],"rel":"衍 child 小孩 ‧ childlike 純真的 ‧ 似 immature 不成熟的","ex":[["Your childish behavior is not suitable for a working environment.","就一個工作環境而言，你這樣幼稚的行為很不恰當。"]]},{"id":"mature","w":"mature","kk":"[məˈtʃʊr]","relWord":9,"pos":"a. & vi.","zh":"成熟的；成熟","ph":[["reach maturity","達到成熟期"],["a premature baby","早產兒"]],"rel":"衍 maturity 成熟（不可數） ‧ premature 不成熟的；過早的","ex":[["You're already a mature adult, so you should make a decision by yourself.","你已經是一個成熟的大人了，所以你應該自己做決定。"],["Girls usually mature earlier than boys.","女孩子通常比男孩子早熟。"]]},{"id":"improve","w":"improve","kk":"[ɪmˈpruv]","num":10,"pos":"vt. & vi.","zh":"改善","ph":[],"rel":"衍 improved 已改善的，有改進的 ‧ 似 better 改善","ex":[["Tom would like to improve his English speaking ability.","湯姆想要增進自己英語口說的能力。"],["As you can see, your father's health has improved a lot.","正如你所見，你父親的健康已改善了很多。"]]},{"id":"improvement","w":"improvement","kk":"[ɪmˈpruvmənt]","relWord":10,"pos":"n.","zh":"改善","ph":[["an improvement in...","……方面有改善"]],"rel":"","ex":[["There has been a great improvement in Debbie's writing skills.","黛比的寫作技巧已有了顯著的改善。"]]},{"id":"progress","w":"progress","kk":"[ˈprɑgrɛs]／[prəˈgrɛs]","relWord":10,"pos":"n. & vi.","zh":"進步；前進（皆不可數）[ˈprɑgrɛs]；進步；逐漸進行 [prəˈgrɛs]","ph":[["make progress","進步；前進"]],"rel":"衍 progressive 進步的 ‧ 似 advance 前進，行進；促進；進步；預付款","ex":[["My daughter has made great progress in tennis.","我女兒的網球大有進步。"],["It was hard for us to make progress because of the heavy snow.","因為下大雪，我們很難前進。"],["Under Bill's expert guidance, the soccer team progressed very well.","在比爾專業的指導下，足球隊進步得很快。"],["Repair work has progressed slower than expected.","維修工作進行得較預期慢。"]]},{"id":"doubt","w":"doubt","kk":"[daʊt]","num":11,"pos":"n. & vt.","zh":"懷疑","ph":[["without (a) doubt","無疑地"],["doubt that...","懷疑……"],["doubt whether / if...","懷疑……是否……"]],"rel":"衍 doubtful 懷疑的 ‧ undoubtedly 無庸置疑地 ‧ doubtless 毫無疑問 ‧ 反 believe 相信 ‧ trust 信任","ex":[["Phil is without a doubt a man you can trust.","毫無疑問菲爾是一個你可以信任的人。"],["I doubt that this team will win.","我懷疑這支球隊是否會贏。"],["Annie really doubts whether the complaint will make a difference.","安妮真的很懷疑申訴會不會有用。"]]},{"id":"ease","w":"ease","kk":"[iz]","num":12,"pos":"n. & vt. & vi.","zh":"舒適；容易（皆不可數）；（使）減緩／降低","ph":[["live a life of ease","過著安逸的生活"],["at ease","感到自在"],["ill at ease","感到不自在"],["with ease = easily","輕鬆地"]],"rel":"補 teamwork 合作","ex":[["My grandfather retired and is living a life of ease.","我爺爺退休了，現在生活過得很安樂。"],["I don't want Kenny to be my partner. I never feel at ease with him.","我不想讓肯尼成為我的搭檔。和他在一起我從不會感到自在過。"],["Thanks to our teamwork, we finished the work with ease.","多虧大夥的團隊合作，我們輕鬆地完成了工作。"],["The doctor said the medicine would ease the pain.","醫生說這藥能減輕疼痛。"],["After Rex took the medicine, his stomach pain eased a little bit.","雷克斯吃了藥之後，胃痛稍微緩解了一些。"]]},{"id":"aid","w":"aid","kk":"[ed]","num":13,"pos":"vt. & n.","zh":"幫助","ph":[["aid sb in + N/V-ing = assist sb in + N/V-ing = help sb (to) V","協助某人……"],["come / go to sb's aid","幫助某人"]],"rel":"衍 aide 助手／理 ‧ 似 help 幫助 ‧ assistance 幫助","ex":[["Wendy aided her husband in managing the company.","溫蒂協助她先生管理這家公司。"],["We all came to Luke's aid when we knew that he was in trouble.","我們得知路克有難時，大家都來幫他一把。"]]},{"id":"review","w":"review","kk":"[rɪˈvju]","num":14,"pos":"vt. & vi. & n.","zh":"複習；評論","ph":[["review for a test / an exam = do review for a test / an exam","為考試來複習"],["have a(n) + adj. + review = receive a(n) + adj. + review","有……的評論"]],"rel":"衍 reviewer 評論家 ‧ preview 試映，預演／展；預先觀看為（書／電影等）寫報導、預評等","ex":[["Review the first five lessons before the exam. = Go over the first five lessons before the exam.","考試前要複習前 5 課。"],["I have to review for the math exam tomorrow. = I have to do the review for the math exam tomorrow.","我得為明天的數學考試進行複習才行。"],["The famous writer's latest novel was reviewed in this weekly magazine.","這週刊有評論這位著名作家最新的小說。"],["This book has had mixed reviews.","這本書的評論褒貶不一。"]]},{"id":"exist","w":"exist","kk":"[ɪgˈzɪst]","num":15,"pos":"vi.","zh":"存在","ph":[],"rel":"","ex":[["Do you really think that ghosts exist?","你真的相信鬼存在嗎？"]]},{"id":"existence","w":"existence","kk":"[ɪgˈzɪstəns]","relWord":15,"pos":"n.","zh":"存在","ph":[["come into existence = come into being","誕生，問世"],["in existence","現存"]],"rel":"","ex":[["Our ancestors had to struggle for existence.","我們的祖先不得不為生存而奮鬥。"],["Tell me exactly when the first radio came into existence.","告訴我第一臺收音機到底是何時問世的。"],["This is the oldest building in existence in our town.","這是我們鎮上現存最古老的建築物。"]]},{"id":"upon","w":"upon","kk":"[əˈpɑn]","num":16,"pos":"prep.","zh":"在……之上；一……（就……）；馬上來臨","ph":[["upon / on + N/V-ing","一……（就……）"]],"rel":"似 on 在……之上；關於","ex":[["There is a dictionary upon the desk.","書桌上有一本字典。"],["Upon seeing his teacher, Mark ran away. = As soon as he saw his teacher, Mark ran away.","馬克一見到他老師便拔腿就跑。"],["Christmas is almost upon us.","聖誕節快到了。"]]},{"id":"serve","w":"serve","kk":"[sɝv]","num":17,"pos":"vt. & vi.","zh":"服務；供應（餐點）","ph":[],"rel":"衍 server 服務生；伺服器 ‧ service 服務","ex":[["I'm afraid Leo is busy serving the customers right now. Can I take a message?","恐怕李歐現在正忙著服務客人。我可以幫您留言嗎？"],["A waitress will serve your food in just a few minutes.","過幾分鐘就會有女服務生過來為您上菜了。"],["You sprinkle some sesame on it, and I'll serve.","你在上面灑點芝麻，我來上菜。"]]},{"id":"servant","w":"servant","kk":"[ˈsɝvənt]","relWord":17,"pos":"n.","zh":"僕人","ph":[["a civil servant","公務員"]],"rel":"似 maid 女傭","ex":[["The rich man has many servants but no friends.","那位有錢人有很多僕人，卻沒有朋友。"],["A civil servant is someone who works for a government department.","公務員指的是在政府部門工作的人。"]]},{"id":"master","w":"master","kk":"[ˈmæstɚ]","relWord":17,"pos":"vt. & n.","zh":"精通；主人；大師","ph":[["be sb's own master","某人自己做主"],["a master of...","擅長……的大師"],["a master's degree","碩士學位"]],"rel":
