告某人某事 ‧ beat 避免 ‧ hit the road 出發","ex":[["I made an attempt to warn Peter of the dangers of the task, but he just wouldn't listen. = I attempted to warn Peter of the dangers of the task, but he just wouldn't listen.","我試著警告彼得該任務的危險性，但他根本聽不進去。"],["In an attempt to beat the traffic, many people hit the road earlier.","為了避免交通擁擠，許多人提早上路。"]]},{"id":"operate","w":"operate","kk":"[ˈɑpəˌret]","num":30,"pos":"vi. & vt.","zh":"運轉；動手術；操作","ph":[["operate on... = perform an operation on...","為／替……動手術"]],"rel":"衍 operation 操作；手術；運轉 ‧ operational 操作上的 ‧ 補 night and day = day and night 夜以繼日","ex":[["This machinery operates night and day.","這個機械裝置日夜運轉。"],["The doctors decided to operate on the man who just had a serious car accident.","醫生決定要替那剛發生嚴重車禍的男子動手術。"],["It takes practice to operate this machine.","要操作這部機器需要練習才行。"]]},{"id":"operator","w":"operator","kk":"[ˈɑpəˌretɚ]","relWord":30,"pos":"n.","zh":"操作人員；接線生，總機","ph":[["a machine / computer operator","機械／電腦操作員"]],"rel":"補 connect 為……接通（電話）","ex":[["All the machine operators in our factory are well-trained.","我們工廠所有的機器操作人員都經過良好的訓練。"],["Operator, please connect me to Mr. Wilson.","總機，麻煩幫我接威爾遜先生。"]]},{"id":"poison","w":"poison","kk":"[ˈpɔɪzn]","num":31,"pos":"n. & vt.","zh":"毒藥；使中毒","ph":[["food poisoning","食物中毒"]],"rel":"衍 poisonous 有毒的 ‧ poisoning 中毒 ‧ 補 sewer 下水道","ex":[["In the movie, the servant tried to kill herself by swallowing poison.","這部電影裡，那僕人試圖服毒自殺。"],["The workers tried to poison the rats in the city's sewers.","那些工人試圖放藥毒死城市下水道的老鼠。"],["It seems that Henry suffers food poisoning.","亨利似乎是食物中毒了。"]]}]},{"id":"L2U48","title":"Level 2 ‧ Unit 48","words":[{"id":"state","w":"state","kk":"[stet]","num":1,"pos":"vt. & n.","zh":"（正式的）陳述，聲明；狀態，情況；國家；（美國等國家的）州，邦","ph":[["in a(n) + adj. + state","處於……的狀態"]],"rel":"衍 statesman 政治家","ex":[["The driver stated the facts clearly.","該名駕駛人清楚地陳述了事實。"],["My grandpa's health is in a good state.","我爺爺的健康狀況良好。"],["Some European states are willing to help the refugees from that country.","一些歐洲國家願意幫助來自那一國的難民。"],["Which state of the United States do you live in?","你住在美國的哪一州？"]]},{"id":"statement","w":"statement","kk":"[ˈstetmənt]","relWord":1,"pos":"n.","zh":"（正式地）聲明，陳述","ph":[["make a statement (to sb)","（向／對某人）發表聲明"]],"rel":"","ex":[["I'd like to make a statement to all of you.","本人想向諸位發表一份聲明。"]]},{"id":"chief","w":"chief","kk":"[tʃif]","num":2,"pos":"a. & n.","zh":"主要的，最重要的；負責人，首領","ph":[["an editor in chief = an editor-in-chief","總編輯（複數為 editors in chief）"],["a commander in chief = a commander-in-chief","總司令（複數為 commanders in chief）"]],"rel":"似 main 主要的，最重要的 ‧ major 主要的，重大的 ‧ primary 首／主要的","ex":[["The chief reason for holding this meeting is to talk about the business trip.","舉行這個會議的主要原因是要討論這趟出差。"],["Mr. Wilson is the chief of our department.","威爾遜先生是我們部門的主管。"],["The editor in chief of this magazine is responsible for the quality and the schedule of the magazine.","這本雜誌的總編輯負責雜誌的品質和進度。"],["When the commander in chief walked into the hall, all the people became quiet.","當總司令走進禮堂時，所有人都安靜了下來。"]]},{"id":"appreciate","w":"appreciate","kk":"[əˈpriʃɪˌet]","num":3,"pos":"vt. & vi.","zh":"感激；欣賞；（貨幣）升值","ph":[["appreciate + N/V-ing = be thankful for sth = be grateful for sth","感激……"]],"rel":"衍 appreciative 感激的 ‧ 反 depreciate 輕視，小看；（使）貶值 ‧ 補 Euro 歐元","ex":[["I really appreciate this opportunity to speak to you. = I really appreciate having this opportunity to speak to you.","我很感激能有機會跟諸位說幾句話。"],["I really appreciate your help. = I'm thankful for your help. = I'm grateful for your help.","我很感激你的幫忙。"],["John's abilities were not fully appreciated by his employer.","約翰的能力並未受到僱主充分賞識。"],["The US dollar keeps depreciating, while the Euro keeps appreciating.","美元持續貶值，而歐元則持續升值。"]]},{"id":"cycle","w":"cycle","kk":"[ˈsaɪkl]","num":4,"pos":"n. & vi.","zh":"循環；騎（腳踏車）","ph":[],"rel":"衍 recycle 回收再利用 ‧ 似 bike 騎（腳踏車）","ex":[["The cycle of the seasons is not obvious in Taiwan.","在臺灣，四季的循環並不明顯。"],["By cycling to and from work every day, I not only save money, but I get a chance to exercise.","我每天騎腳踏車上下班，這樣做我不僅省錢，也有機會運動。"]]},{"id":"downstairs","w":"downstairs","kk":"[ˌdaʊnˈstɛrz]","num":5,"pos":"adv. & a. & n.","zh":"往／在樓下；樓下的；樓下（此意前面加定冠詞 the）","ph":[["go downstairs","下樓"]],"rel":"衍 stairs 樓梯（恆用複數）","ex":[["Benny just went downstairs to get something to eat.","班尼剛剛下樓去找東西吃。"],["My downstairs neighbor is very sensitive to sound.","我樓下的鄰居對聲音很敏感。"],["The downstairs is undergoing renovation.","樓下正在整修中。"]]},{"id":"upstairs","w":"upstairs","kk":"[ˌʌpˈstɛrz]","relWord":5,"pos":"adv. & a. & n.","zh":"往／在樓上；樓上的；樓上（此意前面加定冠詞 the）","ph":[["go upstairs","上樓"]],"rel":"","ex":[["Could you go upstairs to answer the phone?","你可以上樓去接電話嗎？"],["The upstairs window was left open.","樓上的窗戶沒關。"],["Melvin is going to rent the upstairs.","馬文會租樓上。"]]},{"id":"membership","w":"membership","kk":"[ˈmɛmbɚˌʃɪp]","num":6,"pos":"n.","zh":"會員身分／資格","ph":[["a membership fee","會費"]],"rel":"衍 member 成員","ex":[["The membership fee at the golf club is $50,000 per year.","這間高爾夫球俱樂部的會費是 1 年 5 萬美金。"]]},{"id":"tone","w":"tone","kk":"[ton]","num":7,"pos":"n.","zh":"語氣，口吻；音調","ph":[["in a(n) + adj. + tone","以……的語氣／口吻"]],"rel":"","ex":[["I like Haley because she always talks in a gentle tone.","我喜歡海莉，因為她總是用溫和的語氣說話。"],["The guitar has a clean and beautiful tone.","這把吉他的音色純淨美妙。"]]},{"id":"motion","w":"motion","kk":"[ˈmoʃən]","num":8,"pos":"n.","zh":"（物體的）移動","ph":[["in motion","移動中"]],"rel":"","ex":[["Don't get on the train when it's in motion.","火車開動了就不要上車。"]]},{"id":"balance","w":"balance","kk":"[ˈbæləns]","num":9,"pos":"n. & vt. & vi.","zh":"平衡；（銀行帳戶的）餘額；（使）平衡；權衡，斟酌","ph":[["keep / lose one's balance","某人保持／失去平衡"],["strike a balance between A and B","在 A 與 B 之間維持平衡"],["a bank balance","帳戶／戶頭餘額"],["balance A on B","把 A 平衡在 B 上"],["balance A against B","對 A 和 B 兩者作出權衡"]],"rel":"衍 balanced 各方兼顧的 ‧ 反 imbalance 失衡 ‧ 補 broke 身無分文的（= penniless）","ex":[["This yoga pose is so hard; I could hardly keep my balance.","這個瑜伽姿勢太難了；我幾乎無法保持平衡。"],["To lead a happy life, you should strike a balance between work and play.","你若想有個愉快的生活，就應在工作及遊樂之間保持平衡。"],["Tim is nearly broke. His bank balance is only NT$50.","提姆幾乎已身無分文了。他戶頭餘額只剩新臺幣 50 元。"],["Can you balance an egg on the floor?","你會立蛋在地板上嗎？"],["It's not easy to balance when you learn to ride a bike for the first time.","第一次學騎腳踏車要保持平衡不是件易事。"],["You should balance the advantages against the disadvantages before moving to the countryside.","你搬到鄉下前應先權衡利弊。"]]},{"id":"affect","w":"affect","kk":"[əˈfɛkt]","num":10,"pos":"vt.","zh":"影響；（疾病）侵襲；感動，震撼；假裝","ph":[],"rel":"衍 affection 喜愛 ‧ affectionate 深情的 ‧ 似 effect 影響，結果 ‧ 補 indifference 漠不關心，冷淡","ex":[["The bad weather affected everyone's mood.","惡劣的天氣影響了每個人的心情。"],["This disease mainly affects children under 3.","這種疾病主要是 3 歲以下的小孩容易得到。"],["The little boy's miserable life affected us so much that we decided to adopt him.","那個小男孩的可憐身世深深觸動了我們，因此我們決定收養他。"],["Although Dad affected indifference, he was actually very angry.","雖然老爸裝作若無其事，但他其實很生氣。"]]},{"id":"force","w":"force","kk":"[fɔrs]","num":11,"pos":"n. & vt.","zh":"武力，暴力；力；強迫；擠進，強行通過","ph":[["force sb to V","強迫某人做……"],["force one's way through...","強行穿過……，衝過……"]],"rel":"衍 forceful 強有力的","ex":[["Under no circumstances should you resort to force.","不管任何情況你都不應該訴諸暴力。"],["The force of the wind was so strong that it almost knocked me over.","風力之強勁幾乎把我整個人都吹倒了。"],["Don't force me to do anything I don't want to do.","不要強迫我做任何我不想做的事。"],["The policeman forced his way through the crowd to run after the thief.","警察強行穿過人群以追趕小偷。"]]},{"id":"snail","w":"snail","kk":"[snel]","num":12,"pos":"n.","zh":"蝸牛","ph":[["at a snail's pace","非常緩慢地"]],"rel":"似 nail 指甲，腳趾甲","ex":[["Due to heavy traffic, everyone was driving at a snail's pace.","由於交通壅塞，車輛都行駛得非常緩慢。"]]},{"id":"ladybug","w":"ladybug","kk":"[ˈledɪˌbʌg]","relWord":12,"pos":"n.","zh":"瓢蟲","ph":[],"rel":"衍 bug 小蟲子 ‧ 補 curiosity 好奇心","ex":[["The little girl looked at the ladybug on the leaf with curiosity.","小女孩好奇地看著葉子上的瓢蟲。"]]},{"id":"click","w":"click","kk":"[klɪk]","num":13,"pos":"vt. & vi. & n.","zh":"（使）發出短促又響亮的聲音，（使）發出卡嗒聲；按（滑鼠）；短促又響亮的聲音，卡嗒聲","ph":[["click one's heels","某人喀的一聲併攏腳跟"],["click shut","卡嗒一聲關上"],["click on sth","（用滑鼠）點擊某物"],["the click of a mouse","點擊滑鼠（比喻某事可透過電腦很快地達成）"]],"rel":"補 salute 向……敬禮 ‧ icon（電腦）圖示","ex":[["The soldier clicked his heels and saluted the general.","這位士兵喀的一聲併攏腳跟向將軍行禮。"],["Alone at home, the little boy was so afraid that he screamed when a door suddenly clicked shut.","小男孩獨自在家非常害怕，所以當門突然卡嗒一聲關上時，他尖叫出聲。"],["Just click this link and you can download the file.","只要點擊此連結，你就可以下載那檔案了。"],["Just click on the icon twice, and the file will open.","只需用滑鼠點 2 下這個圖示，檔案就會開啟。"],["Turn the dial until you hear a little click.","轉動這個調節器，直到你聽到喀的一聲。"],["You can get almost any information you want with the click of a mouse.","你幾乎可以透過點擊滑鼠來得到任何你想要的資訊。"]]},{"id":"religion","w":"religion","kk":"[rɪˈlɪdʒən]","num":14,"pos":"n.","zh":"宗教（信仰）","ph":[["freedom of religion","宗教信仰自由"]],"rel":"","ex":[["Freedom of religion is a fundamental human right.","宗教信仰自由是一項基本人權。"]]},{"id":"heaven","w":"heaven","kk":"[ˈhɛvən]","relWord":14,"pos":"n.","zh":"天堂","ph":[],"rel":"似 paradise 天堂 ‧ 用法：此字前面不加 the。 ‧ 補 vengeance 報仇","ex":[["Some Christians believe that they will go to heaven after they die.","一些基督徒相信他們死後會上天堂。"],["Heaven's vengeance is slow but sure.","天堂的復仇是緩慢的，但卻是必然的／不是不報，時機未到。—— 諺語"]]},{"id":"soul","w":"soul","kk":"[sol]","relWord":14,"pos":"n.","zh":"靈魂；人","ph":[["a soul mate","心靈伴侶"],["not a soul in sight","半個人都沒看到"]],"rel":"","ex":[["The victim's family said their prayers for the soul of the dead.","被害者的家屬祈禱著，以告慰往生者的在天之靈。"],["Erin and her husband are soul mates for each other.","愛倫和她的丈夫是彼此的心靈伴侶。"],["There was not a soul in sight when I got there.","我到那裡時，半個人影都沒看到。"]]},{"id":"priest","w":"priest","kk":"[prist]","relWord":14,"pos":"n.","zh":"神父，牧師","ph":[],"rel":"似 minister 牧師 ‧ pastor 牧師 ‧ 補 convict 囚犯 ‧ confess 懺悔；承認（錯誤等） ‧ sin 罪","ex":[["The convict confessed all his sins to the priest before the execution.","這名囚犯在被處決之前向神父懺悔了他所有的罪。"]]},{"id":"pray","w":"pray","kk" account","kk":"[əˈkaʊnt]","num":20,"pos":"n. & vi.","zh":"帳戶；報導，描述；說明，解釋","ph":[["open an account","開立帳戶"],["on account of... = because of... = due to... = owing to...","因為……"],["take... into account = take... into consideration","考慮到……"],["account for sth = explain sth","說明某事"]],"rel":"衍 accountable 應負責的","ex":[["I'd like to open a savings account at the bank.","我想在銀行開一個儲蓄帳戶。"],["I read an account of the plane crash in the newspaper.","我在報紙上讀到一篇有關墜機事件的報導。"],["Larry failed the exam on account of laziness.","賴瑞因懶惰而沒通過考試。"],["Before asking Bob to handle this huge mission, you should take his physical condition into account.","你要鮑伯處理此一艱鉅的任務之前，應要先考慮他的身體狀況。"],["Hard work accounts for Daisy's success.","努力是黛西成功的原因。"]]},{"id":"password","w":"password","kk":"[ˈpæswɚd]","relWord":20,"pos":"n.","zh":"密碼","ph":[["enter a password","輸入密碼"]],"rel":"似 code 代碼，密碼","ex":[["You need to enter the password to withdraw money.","你得輸入密碼才能領錢。"]]},{"id":"billion","w":"billion","kk":"[ˈbɪljən]","num":21,"pos":"n.","zh":"10 億","ph":[["billions of + 複數可數名詞","非常多的……"]],"rel":"衍 billionaire 億萬富翁","ex":[["The company had a debt of nearly one billion NT dollars after it went bankrupt.","那間公司破產後負債近 10 億新臺幣。"],["The government spent billions of dollars to build a subway system.","該政府花了大筆的錢建造地鐵系統。"]]},{"id":"arrow","w":"arrow","kk":"[ˈæro]","num":22,"pos":"n.","zh":"箭；箭頭（符號）","ph":[["shoot an arrow at...","用箭射……"]],"rel":"","ex":[["The hunter shot an arrow at the deer but missed it.","獵人把箭射向那隻鹿卻沒射中。"],["Follow the red arrows to the meeting room.","跟著紅色的箭頭到會議室去。"]]},{"id":"liberal","w":"liberal","kk":"[ˈlɪbərəl]","num":23,"pos":"a.","zh":"自由的，開放／明的；肆意的，大量的","ph":[["be liberal (with sth)","（在某事物方面）很肆意，有大量的（某事物）"]],"rel":"衍 liberty 自由 ‧ 反 conservative 保守的","ex":[["Nowadays, teenagers seem to take a more liberal attitude toward sex.","現在的青少年似乎對性的態度比較開放。"],["Norman was criticized for being too liberal with the company's money.","諾曼被批評花公司的錢太隨便。"]]},{"id":"freedom","w":"freedom","kk":"[ˈfridəm]","relWord": ht track now.","藍迪曾混過幫派，但他現在回到正軌了。"],["It's hard to keep track of all my old friends; in fact, I've lost contact with most of them.","和所有的老友保持聯繫很困難，事實上，我已經和他們大部分的人失聯了。"],["The cars must do 100 laps of the race track.","這些車必須繞比賽跑道 100 圈。"],["Although Paul is not good at math or English, he always does well in track and field.","雖然保羅不擅長數學和英文，但他在田徑運動方面的表現總是很出色。"],["That's my favorite track on the album.","那是我這張專輯最愛的曲子。"],["These dogs are used to track those who have escaped from jail.","這些狗被用來追蹤越獄的人。"],["The police finally tracked down the place where the robbers were hiding.","警方終於找到了那些搶匪的藏身處。"],["The cat tracked mud all over the kitchen floor.","這隻貓在整個廚房地板留下泥巴的痕跡。"]]},{"id":"path","w":"path","kk":"[pæθ]","relWord":1,"pos":"n.","zh":"小徑，小路；途徑","ph":[["a path to success / freedom","（前往）成功／自由之路"]],"rel":"","ex":[["We walked down the path that led to the village.","我們沿著通往村莊的小路走下去。"],["Believing in yourself is the first step on the path to success.","相信自己是前往成功途徑的第一步。"]]},{"id":"lane","w":"lane","kk":"[len]","relWord":1,"pos":"n.","zh":"巷子／道；車道","ph":[],"rel":"","ex":[["Walk down the lane and you'll see my house.","沿著這條巷子走下去，你就會看到我家。"],["Cars are not allowed to drive in the bike lane.","車子不能行駛在自行車道上。"]]},{"id":"nation","w":"nation","kk":"[ˈneʃən]","num":2,"pos":"n.","zh":"國家","ph":[["the United Nations","聯合國"]],"rel":"衍 national 國家的；國立的 ‧ international 國際的 ‧ nationality 國籍；民族 ‧ nationalism 國家／民族主義 ‧ 似 country 國家","ex":[["This nation only has a small population.","這個國家僅有少數人口。"],["The purpose of the United Nations is to maintain international peace.","聯合國的宗旨是維繫國際和平。"]]},{"id":"domestic","w":"domestic","kk":"[dəˈmɛstɪk]","relWord":2,"pos":"a.","zh":"國內的；家庭的","ph":[],"rel":"衍 domesticate 馴養 ‧ 反 foreign 外國的 ‧ 補 chore 雜務，瑣事","ex":[["Ralph prefers domestic products to imported ones.","與進口產品相比，雷夫更喜歡國產品。"],["I have many domestic chores to do on weekends.","週末時我有許多家事要做。"]]},{"id":"appetite","w":"appetite","kk":"[ˈæpəˌtaɪt]","num":3,"pos":"n.","zh":"胃口；強烈欲望，渴望","ph":[["give sb a good appetite","讓某人胃口很好"],["have an appetite for sth = have a liking for sth = have a passion for sth = enjoy sth","很渴望某物"]],"rel":"衍 appetizer 開胃菜","ex":[["Regular exercise gives us a good appetite.","規律的運動會讓我們的胃口很好。"],["My son has a great appetite for basketball.","我兒子很愛打籃球。"]]},{"id":"grain","w":"grain","kk":"[gren]","num":4,"pos":"n.","zh":"穀粒，穀（物）；細粒","ph":[["take sth with a grain of salt","對某事採保留態度，對某事半信半疑"]],"rel":"用法：任何粒狀物皆可與 grain 並用：a grain of salt 一粒鹽 ‧ a grain of sand 一粒沙 ‧ a grain of sugar 一粒砂糖","ex":[["Last year's grain harvest was the worst since 1995.","去年的穀物收成是自 1995 年以來最差的一次。"],["Chris is a liar, so you'd better take his story with a grain of salt.","克里斯是個騙子，所以你最好對他的說詞採取保留的態度。"]]},{"id":"instrument","w":"instrument","kk":"[ˈɪnstrəmənt]","num":5,"pos":"n.","zh":"樂器（= musical instrument）；器械／具","ph":[],"rel":"似 tool 工具","ex":[["How many musical instruments can you play?","你會彈奏幾種樂器？"],["A scale is a common instrument in science.","磅秤是科學中常用的工具。"]]},{"id":"fault","w":"fault","kk":"[fɔlt]","num":6,"pos":"n. & vt.","zh":"過失（不可數）；缺點；挑出毛病","ph":[["be at fault = be wrong","有過錯"],["find fault with...","對……吹毛求疵"]],"rel":"似 mistake 錯誤 ‧ defect 缺點；生理缺陷","ex":[["No one was at fault in the accident.","這次的意外誰都沒有錯。"],["Laziness is definitely Ray's biggest fault.","懶惰肯定是雷最大的缺點。"],["I don't like Owen because he tends to find fault with everything I do.","我不喜歡歐文，因為他總是對我做的每件事吹毛求疵。"],["It's hard to fault Oliver's performance.","要從奧利佛的表現中挑毛病很難。"]]},{"id":"trap","w":"trap","kk":"[træp]","num":7,"pos":"n. & vt.","zh":"陷阱；圈套，騙局，詭計；設陷阱捕捉","ph":[["trap, trapped, trapped","三態"],["be / get caught in a trap","落入了陷阱中，困在陷阱中"],["fall into the trap of + V-ing","上了當去做……，掉入圈套去做……"],["be trapped = be stuck","被困住，受困"]],"rel":"衍 mousetrap 捕鼠器","ex":[["A lion was caught in the hunter's trap.","一頭獅子困在獵人的陷阱中。"],["Don't fall into the trap of buying more than you need.","別掉入圈套去買你不需要的東西。"],["The reporter asked the natives how they trap animals.","記者問當地人他們是如何設陷阱捕捉動物的。"],["Many people were trapped in urden on sb","讓某人背負重擔"],["burden sb with sth","用某事物來煩某人"]],"rel":"似 load 負重，負荷；裝載","ex":[["The old horse looked sad under its heavy burden.","老馬馱著重物看起來很哀傷。"],["Ever since his father passed away, Stanley has shouldered the burden of raising his family.","史丹利的父親過世後，他就負起養家的重擔。"],["Tom's illness placed a huge burden on his parents.","湯姆生病讓他的雙親背負沉重的負擔。"],["I don't want to burden you with these matters; I can take care of them myself.","我不想讓這些事造成你的負擔；我自己可以處理。"]]},{"id":"gradual","w":"gradual","kk":"[ˈgrædʒʊəl]","num":3,"pos":"a.","zh":"逐漸的；平緩的","ph":[],"rel":"反 sudden 突然的 ‧ steep 陡峭的","ex":[["After Taylor exercised twice a week and ate less, there was a gradual change in his body.","泰勒每週運動 2 次並少吃後，他的身體逐漸出現了變化。"],["A gradual slope leads to the castle's main entrance.","這緩坡會通往城堡的主要入口。"]]},{"id":"classic","w":"classic","kk":"[ˈklæsɪk]","num":4,"pos":"a. & n.","zh":"經典的，優秀的；典型的；典雅的；經典之作；古典文學名著（此意恆用複數，前面加定冠詞 the）","ph":[],"rel":"似 typical 典型的","ex":[["This novel is considered a classic work of science fiction.","這本小說被認為是科幻小說的經典之作。"],["The soccer team's winning goal was classic.","這支足球隊致勝進的那一球真是漂亮。"],["Teddy was suffering from the classic symptoms of the illness.","泰迪患有該疾病的典型症狀。"],["Eileen's mother prefers classic furniture designs.","艾琳的母親偏好典雅的傢俱設計。"],["Ingmar Bergman's films are true classics.","英格瑪‧柏格曼的電影是真正的經典名作。"],["Eric likes to spend some time reading the classics.","艾瑞克喜歡花時間閱讀古典文學作品。"]]},{"id":"classical","w":"classical","kk":"[ˈklæsɪkl]","relWord":4,"pos":"a.","zh":"（音樂）古典的；傳統的","ph":[["classical music","古典樂"]],"rel":"似 traditional 傳統的","ex":[["Do you like to listen to classical music?","你喜歡聽古典樂嗎？"],["I prefer modern ballet to classical ballet because the former makes my body feel free.","與古典芭蕾相比，我更喜歡現代芭蕾，因為現代芭蕾讓我的身體感到很自由。"]]},{"id":"beard","w":"beard","kk":"[bɪrd]","num":5,"pos":"n.","zh":"下巴及兩耳下方的鬍鬚","ph":[["wear / have a beard","有鬍子"],["grow a beard","留鬍子"],["shave (off) a beard","剃某人的鬍子"]],"rel":"似 bear 熊 ‧ 比 mustache 八字鬍，小鬍子〔美〕（= moustache〔英〕）","ex":[["My grandfather wears a bushy beard.","我的爺爺有很濃密的鬍子。"],["My brother told me he wanted to grow his beard, but I said he would look ugly that way.","我哥哥告訴我說他想留鬍子，但我說那樣他會很醜。"],["David shaves off his beard every morning.","大衛每天早上剃鬍子。"]]},{"id":"link","w":"link","kk":"[lɪŋk]","num":6,"pos":"vt. & n.","zh":"使有（實體）連結；使相關聯；關聯；（網際網路的）連結","ph":[["link A to / with B = A be linked to / with B","將 A 與 B 有（實體）連結；使 A 與 B 有相關性"],["a link between A and B","A 和 B（之間）有相關性"]],"rel":"似 connect（使）連結 ‧ associate 使有關聯 ‧ hyperlink 超連結 ‧ 補 obesity 肥胖（症）","ex":[["The bridge links the island to the mainland.","這座橋連接這個小島到大陸。"],["Researchers say lung cancer is linked to smoking.","研究者指出肺癌與抽菸有關。"],["There's a strong link between diet and obesity.","飲食與肥胖間有強烈的關聯。"],["Just click on this link, and you can see the pdf.","只需點這個連結，你就可以看到 pdf 檔。"]]},{"id":"connection","w":"connection","kk":"[kəˈnɛkʃən]","relWord":6,"pos":"n.","zh":"關係，關聯；（實體）連接；（電線等的）接頭，連接部分","ph":[["have a connection with...","和……有關係"],["in connection with...","與……有關"]],"rel":"似 association 關聯；協會 ‧ bond 關係；（與某人）建立關係","ex":[["Do you have any connection with the Mafia?","你和黑手黨有什麼關係嗎？"],["The man was questioned in connection with a robbery.","這男子因與搶案有關聯而被審問。"],["I think something is wrong with the Wi-Fi connection.","我認為無線網路的連接有問題。"],["Ted fixed the loose connection, and now the copy machine works fine.","泰德修好鬆動的接頭了，現在影印機能用了。"]]},{"id":"relate","w":"relate","kk":"[rɪˈlet]","relWord":6,"pos":"vt. & vi.","zh":"使相關；敘述；和……有關；理解","ph":[["relate A to B = A is related to B","找到 A 與 B 有關"],["relate sth to sb","向某人敘述某事物"],["relate to sb/sth","和某人／事物有關"],["relate to sb","理解某人，與某人產生共鳴"]],"rel":"衍 relation 關係；親戚 ‧ relationship 關係","ex":[["Spanish and French are related to Latin.","西班牙文及法文與拉丁文有淵源。"],["Grandfather related a story to us yesterday.","爺爺昨天跟我們說了一個故事。"],["That news relates to the problem we were just discussing.","那則新聞和我們剛才討論的問題有關。"],["Dean can relate to the main character in the movie because he also had a difficult childhood.","狄恩可以與電影中的主角產生共鳴，因為他的童年也 nety degrees.","這容器可以承受負 20 度到正 90 度。"],["Jerry got an A plus on his English paper.","傑瑞的英文報告拿了 A 加。"]]},{"id":"extra","w":"extra","kk":"[ˈɛkstrə]","relWord":17,"pos":"n. & a. & adv.","zh":"另外付點錢就可額外得到的東西，加購品；額外的；額外地","ph":[["an extra + 數字 = an additional + 數字","額外若干……"]],"rel":"似 additional 額外的 ‧ spare 多餘的，備用的 ‧ surplus 多餘的","ex":[["The pan comes with some nice extras, such as these mugs.","平底鍋有附一些不錯的加購品，比如這些杯子。"],["We need an extra two hours to complete the work.","我們需要額外 2 個小時才能完成這工作。"],["The restaurant charges extra if we bring our own drinks.","如果我們自己帶飲料，那家餐廳會額外收費。"]]},{"id":"humble","w":"humble","kk":"[ˈhʌmbl]","num":18,"pos":"a.","zh":"（地位）卑微的，清寒的；謙遜的","ph":[],"rel":"衍 humbleness（地位）卑微；謙遜 ‧ 似 modest 謙虛的","ex":[["Barbara was born into a humble family.","芭芭拉出生在一個清寒的家庭。"],["Though Jackson is very famous, he is humble.","雖然傑克森很有名，他為人卻很謙虛。"]]},{"id":"expense","w":"expense","kk":"[ɪkˈspɛns]","num":19,"pos":"n.","zh":"花錢；代價","ph":[["be worth the expense","值得花錢"],["at sb's expense","花某人的錢"],["at the expense of sth","以某事物為代價，放棄某事物"]],"rel":"衍 expensive 昂貴的 ‧ expenditure（政府或個人的）開支／銷","ex":[["Nick thinks buying a bigger car is worth the expense.","尼克認為值得花錢買臺大一點的車。"],["We took a trip to Spain at my mom's expense.","我們花我媽媽的錢去西班牙旅行。"],["Some taxi drivers often drive fast at the expense of safety.","一些計程車司機經常不顧安全在開快車。"]]},{"id":"angle","w":"angle","kk":"[ˈæŋgl]","num":20,"pos":"n.","zh":"角度；觀點","ph":[["a right angle","直角"],["from a different angle / perspective","從另一個角度來看"]],"rel":"似 angel 天使 ‧ 補 perspective 看法，觀點","ex":[["The interior angles of a square are right angles.","正方形的內角是直角。"],["From a different angle, divorce might be the best solution to your problems.","從另一個角度來看，離婚也許是解決你們問題的最佳途徑。"]]},{"id":"branch","w":"branch","kk":"[bræntʃ]","num":21,"pos":"n. & vi.","zh":"分部，分公司；樹枝；分岔","ph":[["open a branch","成立分部／分公司"],["branch off from...","從……岔開／分岔"],["branch out","涉足（新工作）"]],"rel":"","ex":[["Simon is planning to open a branch in Bangkok next month.","賽門計劃下個月在曼谷成立一家分公司。"] ["My *neighbor* Amy *bakes* there every morning, never in a *hurry*.","我的鄰居艾咪每天早上在那裡烘焙，從不匆忙。"],
["She makes *buns* with *jam*, and on weekends she prepares *barbecue* *pork* and *lamb*.","她做果醬麵包，週末還準備烤豬肉和羊肉。"],
["Drivers who pass at high *speed* often stop when they smell the *bread*.","高速經過的駕駛人聞到麵包香，常常會停下來。"],
["Once a *policeman* on his way to *hunt* for a lost dog bought six buns for the *hunters*.","有一次一位正要去尋找走失的狗的警察，買了六個麵包給搜尋隊。"],
["Amy always says, \"I *trust* my hands more than any machine.\"","艾咪總是說：「我信任我的雙手勝過任何機器。」"],
["Behind the shop she grows *grapes*, *peaches*, and a small *pear* tree.","店後面她種了葡萄、桃子和一棵小梨樹。"],
["When I am *thirsty* after a long walk in the *wild*, that little shop feels like home.","當我在野外長途步行後口渴時，那間小店感覺就像家。"]],
q:[
["Where is the bakery?",["In the forest.","Beside the highway.","In town."],1,"第 1 句。"],
["Why do drivers stop?",["They smell the bread.","They need gas.","They are lost."],0,"第 4 句。"],
["What does Amy trust most?",["Machines.","Her hands.","Her neighbors."],1,"第 6 句。"]]},

"L2U40":{t:"The Hero of the Café",zt:"咖啡館的英雄",
c:[["be in a good mood","心情很好"],["mention sth to sb","向某人提起某事"],["download a file","下載檔案"],["for safety's sake","為了安全起見"]],
p:[
["My *nephew* works at a small *café* where he *mixes* drinks and serves warm *cocoa*.","我姪子在一間小咖啡館工作，他調飲料並供應溫熱的可可。"],
["Last Tuesday an old *lady* fell near the *screen* by the door.","上週二一位老太太在門邊的螢幕附近跌倒了。"],
["She was *deaf*, so she could not hear the noise of the *printer* or the shouting.","她聽不見，所以聽不到印表機的聲音或叫喊聲。"],
["My nephew stayed *gentle* and *calm*; he brought a clean *tissue* and checked her *skin*.","我姪子保持溫和冷靜；他拿來乾淨的面紙，檢查她的皮膚。"],
["He asked a *gentleman* nearby to call for help, and he did not *beg* for attention.","他請附近一位先生打電話求助，而且沒有乞求任何關注。"],
["Later the woman's *niece* came and *mentioned* that they had just moved to the city.","後來那位女士的姪女來了，提到她們才剛搬到這個城市。"],
["For *safety*'s sake, the café *combined* two tables to make the path wider.","為了安全起見，咖啡館把兩張桌子合併，讓走道更寬。"],
["Everyone called him a *hero*, but he only smiled and went back to washing the *mugs*.","大家都叫他英雄，但他只是笑一笑，回去洗馬克杯了。"]],
q:[
["Why could the old lady not hear?",["She was deaf.","The printer was loud.","She was asleep."],0,"第 3 句。"],
["What did the nephew do first?",["He called the police.","He stayed calm and checked her skin.","He moved the tables."],1,"第 4 句。"],
["Why did the café combine two tables?",["To serve more people.","For safety's sake.","To sell snacks."],1,"第 7 句。"]]},
"L2U41":{t:"The Golden Platform",zt:"金色的月台",
c:[["make an effort","努力"],["be curious about...","對……感到好奇"],["divide sth into...","把某物分成……"],["in general","一般而言"]],
p:[
["The old *railroad* station near my house has a *wooden* roof and a *plain* *platform*.","我家附近的舊火車站有木造的屋頂和樸素的月台。"],
["At six in the morning it is completely *silent*, and the *silence* feels *royal*.","早上六點時那裡完全安靜，那份寂靜有種尊貴的感覺。"],
["An *average* day brings only a *minority* of travelers, mostly *folk* from nearby villages.","一般的日子只有少數旅客，多半是附近村莊的居民。"],
["The station *host* is a kind man who never lets a *guest* feel like a *bother*.","車站的站務員是位親切的人，從不讓客人覺得自己是個麻煩。"],
["He *divided* the waiting room into two *sections*: one for *primary* school children, one for adults.","他把候車室分成兩個區域：一個給小學生，一個給成人。"],
["Last year he *discovered* an old *silver* clock behind a wall, and the *discovery* made the news.","去年他在牆後發現了一座舊銀鐘，這個發現上了新聞。"],
["Some *rude* teenagers once *bent* the display case, but he made a great *effort* to repair it.","曾有幾個沒禮貌的青少年弄彎了展示櫃，但他費了很大的力氣修好它。"],
["\"A *rare* thing,\" he said, \"is not *gold*; it is care that never *slips*.\"","「稀有的東西，」他說，「不是黃金；而是永不鬆懈的用心。」"]],
q:[
["What did the host find behind a wall?",["A golden coin.","An old silver clock.","A wooden roof."],1,"第 6 句。"],
["How did he divide the waiting room?",["Into two sections.","Into three parts.","He did not divide it."],0,"第 5 句。"],
["What is the rare thing, according to him?",["Gold.","Care that never slips.","Silence."],1,"最後一句。"]]},

"L2U42":{t:"Culture in the Valley",zt:"山谷裡的文化",
c:[["struggle to V","努力做……"],["take a vote","進行表決"],["a strict rule","嚴格的規定"],["be absent from...","缺席……"]],
p:[
["Our village lies in a deep *valley* below a high *peak*, far from *current* city *technology*.","我們的村莊位於高峰下的深谷中，遠離現今的都市科技。"],
["Last month a *crowd* gathered at the *entrance* of the old *gymnasium* to *vote*.","上個月一群人聚集在舊體育館的入口進行投票。"],
["The question was simple: should we build a *narrow* road or keep our *cultural* traditions?","問題很簡單：我們該蓋一條窄路，還是保留我們的文化傳統？"],
["An *expert* came from the city and put every *sheet* of *data* on the wall.","一位專家從城裡來，把每一張資料都貼在牆上。"],
["\"You will *earn* more *income*,\" he said, \"but the *chain* of change is hard to stop.\"","「你們會賺到更多收入，」他說，「但改變的連鎖反應很難停止。」"],
["An old woman *nodded* slowly, then stood up, though her *ankle* hurt.","一位老婦人緩緩點頭，然後儘管腳踝疼痛還是站了起來。"],
["\"It is a *shame*,\" she said, \"to *imagine* our *image* only through money.\"","「只透過金錢來想像我們的形象，」她說，「是件可惜的事。」"],
["The *delay* was long, and no one was *absent*; we all *struggled* toward one answer.","表決拖了很久，沒有人缺席；我們都努力尋找一個答案。"]],
q:[
["Why did the crowd gather?",["To vote about a road.","To watch a game.","To meet an expert only."],0,"第 2 句與第 3 句。"],
["What did the expert warn about?",["The chain of change is hard to stop.","The road is too narrow.","The data is wrong."],0,"第 5 句。"],
["What did the old woman say?",["Money is the best measure.","It is a shame to see themselves only through money.","She would leave the village."],1,"第 7 句。"]]},

"L2U43":{t:"After the Typhoon",zt:"颱風之後",
c:[["make a promise","許下承諾"],["pluck up the courage","鼓起勇氣"],["in memory of...","為紀念……"],["take one's temperature","量體溫"]],
p:[
["The *typhoon* came at night with heavy *thunder*, and by morning the *fog* was thick.","颱風在夜裡帶著強烈的雷聲來襲，到早上霧氣濃重。"],
["The *official* *temperature* dropped fast, and the *university* on the hill closed its gate.","官方氣溫迅速下降，山上的大學關閉了校門。"],
["My father, who teaches at a *college*, went out with a *wire* and a box of tools.","我爸爸在專科學校教書，他帶著電線和一箱工具出門。"],
["He had made a *promise* to help our neighbor, and he never lets a promise *disappear*.","他答應要幫鄰居，而他從不讓承諾消失。"],
["I *admit* that I was afraid, but his *appearance* at the door gave me *courage*.","我承認我很害怕，但他出現在門口給了我勇氣。"],
["He *measured* the *length* and *width* of the broken roof and wrote down every *measurement*.","他量了破損屋頂的長度和寬度，並記下每一個數據。"],
["\"Do not *disagree* with the weather,\" he laughed. \"*Indeed*, you can only prepare.\"","「不要跟天氣爭辯，」他笑著說，「的確，你只能事先準備。」"],
["That *ordinary* morning is still one of the most *positive* *memories* of my life.","那個平凡的早晨，仍是我人生中最正面的回憶之一。"]],
q:[
["What did the father take with him?",["A wire and a box of tools.","A camera.","A thermometer."],0,"第 3 句。"],
["Why did the writer feel brave?",["The fog cleared.","His father appeared at the door.","The typhoon stopped."],1,"第 5 句。"],
["What did the father write down?",["Every measurement of the roof.","A promise.","The temperature."],0,"第 6 句。"]]},

"L2U44":{t:"The Purpose of an Essay",zt:"一篇文章的目的",
c:[["be worth + V-ing","值得做……"],["be willing to V","願意做……"],["in advance","事先"],["focus on...","專注於……"]],
p:[
["Our teacher asked us to write a short *essay* about the *purpose* of daily *law*.","老師要我們寫一篇關於日常法律目的的短文。"],
["Each *unit* had one *chapter*, and every *chart* had to include real *data*.","每一單元有一章，每張圖表都必須包含真實的數據。"],
["I was *upset* at first, because I could not find a clear *goal* or *target*.","起初我很沮喪，因為我找不到明確的目標。"],
["My friend read my *brief* draft on the *balcony* and gave a *fair* *judgment*.","我朋友在陽台上讀了我的簡短草稿，給了公正的評論。"],
["\"This *article* is *valuable*,\" she said, \"but you should *focus* on one *aim*.\"","「這篇文章很有價值，」她說，「但你應該專注在一個目標上。」"],
["She was *willing* to help me *anytime*, and *anyway* she liked reading *comics* more.","她隨時願意幫我，反正她比較喜歡看漫畫。"],
["I rewrote the whole thing *in advance* of the deadline and *delivered* it on Monday.","我在截止日前重寫了整篇，並在週一交出。"],
["The teacher wrote one line: \"*Justice* is not a *custom*; it must stay *alive*.\"","老師寫了一行字：「正義不是習俗；它必須保持活著。」"]],
q:[
["What was the writer's first problem?",["No clear goal or target.","No data.","No time."],0,"第 3 句。"],
["What did the friend suggest?",["Add more charts.","Focus on one aim.","Write about comics."],1,"第 5 句。"],
["What did the teacher write?",["Justice must stay alive.","The essay was too brief.","Deliver it on Monday."],0,"最後一句。"]]},

"L2U45":{t:"A Debate About Tradition",zt:"一場關於傳統的辯論",
c:[["argue with sb","與某人爭論"],["be responsible for...","為……負責"],["insist on + V-ing","堅持做……"],["a solution to...","……的解決辦法"]],
p:[
["Last week our class held a *debate* with the *title* \"Should we keep every old *tradition*?\"","上週我們班舉行了一場辯論，題目是「我們該保留每一項舊傳統嗎？」"],
["My *classmate* Ben took the *position* that *ancient* rules are a *puzzle* we no longer need.","我同學班主張古老的規則是我們不再需要的謎團。"],
["I *argued* the other side and *insisted* that a *historical* *belief* can still *require* respect.","我持相反立場，堅持歷史信念仍然值得尊重。"],
["Our *argument* was *broad*, and *nearly* every student wanted to *reply*.","我們的辯論範圍很廣，幾乎每位同學都想回應。"],
["Ben said the *evil* of blind habit is a *crisis* for a young *nation*.","班說盲目習慣的弊病，對一個年輕的國家是一場危機。"],
["I said a *regular* festival at a *nearby* temple is not a *rat* in the kitchen.","我說附近寺廟的定期節慶，並不是廚房裡的老鼠。"],
["In the end the teacher gave an *impressive* *solution*: keep the meaning, change the *form*.","最後老師給了一個令人印象深刻的解答：保留意義，改變形式。"],
["Good *leadership*, she said, means being *responsible* for both the past and the future.","她說，好的領導意味著同時對過去和未來負責。"]],
q:[
["What was Ben's position?",["Old rules are still needed.","Ancient rules are no longer needed.","Festivals should grow."],1,"第 2 句。"],
["What did the writer insist?",["A historical belief can still require respect.","Traditions cost too much.","Debate is useless."],0,"第 3 句。"],
["What was the teacher's solution?",["Keep the meaning, change the form.","Cancel all festivals.","Let students vote."],0,"第 7 句。"]]},

"L2U46":{t:"An Instant Decision",zt:"瞬間的決定",
c:[["in an instant","立刻"],["fall asleep","睡著"],["make progress","進步"],["avoid + V-ing","避免做……"]],
p:[
["*Whatever* the reason, our morning *review* class had to be *canceled* last Friday.","不管原因是什麼，我們上週五的晨間複習課必須取消。"],
["A fire *alarm* rang, and *in an instant* the whole building was awake.","火警警報響起，一瞬間整棟大樓都醒了。"],
["Some students were still *sleepy*; one had *fallen asleep* on a *mat* near the *curtain*.","有些學生還很想睡；有一位在窗簾旁的墊子上睡著了。"],
["Our teacher did not *doubt* the plan for a second; she *proposed* the safest exit.","老師連一秒都沒有懷疑計畫；她提出最安全的出口。"],
["\"*Avoid* running,\" she said calmly. \"*Whoever* is nearest the door goes first.\"","「避免奔跑，」她冷靜地說，「離門最近的人先走。」"],
["Outside, we *served* water to the younger children and waited with *ease*.","在外面，我們給年幼的孩子倒水，安心地等待。"],
["The *exact* cause was a *sudden* problem with an *electric* *dot* on the alarm board.","確切的原因是警報面板上一個電子點突然故障。"],
["Later the *mass* of students *praised* her, but she said, \"*Improvement* comes from practice.\"","後來一大群學生稱讚她，但她說：「進步來自練習。」"]],
q:[
["Why was the class canceled?",["A fire alarm rang.","The teacher was ill.","It was a holiday."],0,"第 1 句與第 2 句。"],
["What did the teacher tell students to avoid?",["Talking.","Running.","Waiting."],1,"第 5 句。"],
["What was the exact cause?",["A real fire.","A sudden electric problem on the alarm board.","A student's mistake."],1,"第 7 句。"]]},

"L2U47":{t:"The Gardener and the Soil",zt:"園丁與土壤",
c:[["blame sb for sth","為某事責怪某人"],["respond to...","回應……"],["attempt to V","試圖做……"],["be typical of...","是……的典型"]],
p:[
["Mr. Ho is a *gardener* who has worked in the same *grand* park for thirty years.","何先生是位園丁，他在同一座宏偉的公園工作了三十年。"],
["He knows every *complex* *system* of *soil*, water, and light.","他了解土壤、水和光線之間每一套複雜的系統。"],
["Last year a *huge* *tale* spread online: the trees were dying from *poison*.","去年網路上流傳一個誇大的說法：那些樹因中毒而死。"],
["People *blamed* the park *employer*, and one *salesperson* even sold a strange *rubber* tool as a cure.","人們責怪公園的僱主，還有一位業務員甚至賣一種奇怪的橡膠工具當作解方。"],
["Mr. Ho did not *respond* with anger; he *attempted* to explain the *obvious* facts.","何先生沒有生氣回應；他試圖說明顯而易見的事實。"],
["\"The *possibility* of poison is *tiny*,\" he said. \"This is a *typical* case of dry soil.\"","「中毒的可能性極小，」他說，「這是典型的土壤乾旱。」"],
["He *operated* the old *electric* pump *till* midnight for a week, and the leaves *survived*.","他連續一週操作舊的電動抽水機到午夜，樹葉活了下來。"],
["*Thus* one quiet *employee* proved that *survival* often depends on a *proper* habit.","於是，一位安靜的員工證明了：存活往往取決於一個恰當的習慣。"]],
q:[
["What did people believe last year?",["The trees were dying from poison.","The gardener had left.","The park would close."],0,"第 3 句。"],
["How did Mr. Ho respond?",["With anger.","He tried to explain the facts.","He sold a tool."],1,"第 5 句。"],
["What saved the trees?",["A rubber tool.","Working the pump till midnight for a week.","Rain."],1,"第 7 句。"]]},

"L2U48":{t:"A Question of Balance",zt:"平衡的問題",
c:[["keep one's balance","保持平衡"],["appreciate + V-ing","感激……"],["take sth into account","把某事納入考量"],["in motion","運轉中"]],
p:[
["My uncle *states* one *policy* every year: work *upstairs*, rest *downstairs*.","我叔叔每年都會宣告一項原則：在樓上工作，在樓下休息。"],
["He runs a small *account* office and *appreciates* every *tone* of a quiet morning.","他經營一間小型會計事務所，珍惜每一種安靜早晨的氣息。"],
["\"*Balance* is not a *state*,\" he says. \"It is a *cycle* always *in motion*.\"","「平衡不是一種狀態，」他說，「它是一個持續運轉的循環。」"],
["Last month his *membership* at the gym ended, and his health began to *affect* his work.","上個月他的健身房會員資格到期，健康開始影響他的工作。"],
["So he *laid* a mat by the window and began to walk like a *snail* every evening.","於是他在窗邊鋪了一張墊子，每天傍晚像蝸牛一樣慢慢走。"],
["He *maintains* that a slow *force* is stronger than a fast one.","他堅持緩慢的力量比快速的力量更強。"],
["His *statement* *indicates* something simple: *internal* peace *sorts* out the rest.","他的說法指出一件簡單的事：內在的平靜會把其餘的事理順。"],
["Now he *claps* his hands once at six and says, \"Enough. Tomorrow is a new *cycle*.\"","現在他六點時拍一次手，說：「夠了。明天是新的一輪。」"]],
q:[
["What is his yearly policy?",["Work upstairs, rest downstairs.","Never rest.","Work only in the morning."],0,"第 1 句。"],
["What is balance, according to him?",["A fixed state.","A cycle always in motion.","A membership."],1,"第 3 句。"],
["What does he do at six?",["He claps his hands once.","He goes to the gym.","He starts working."],0,"最後一句。"]]},

"L2U49":{t:"On the Coast Path",zt:"海岸步道上",
c:[["participate in...","參加……"],["be available","可取得的，有空的"],["altogether","總共"],["find fault with...","對……吹毛求疵"]],
p:[
["Every *nation* has a walk that people love, and ours is the *coast* *path* near the old *port*.","每個國家都有一條大家喜愛的步道，我們的是舊港口附近的海岸步道。"],
["Last month I *participated* in a thirty-*mile* walk and carried a bag of only two *kilograms*.","上個月我參加了一場三十英里的健行，只背了兩公斤重的背包。"],
["*Altogether*, two hundred *fellows* joined, and each carried a *flat* backpack.","總共有兩百位夥伴參加，每個人都背著一個扁平的背包。"],
["The *track* was *dull* at first, but after one *mile* the sea appeared below the *shore*.","一開始步道很單調，但走了一英里後，海就出現在岸邊下方。"],
["A guide taught us the *function* of each *instrument* in his bag.","一位嚮導教我們他包裡每件器材的功能。"],
["\"Do not *find fault with* the weather,\" he *greeted* us. \"It is *available* to everyone equally.\"","「不要對天氣吹毛求疵，」他向我們問候，「它對每個人都同樣可及。」"],
["My *appetite* was huge at noon; I *swallowed* two bowls of *grain* soup in ten minutes.","中午時我食慾大開，十分鐘內吞下兩碗穀物湯。"],
["That day became a *symbol* for me: to *behave* well is simply to walk on, step by step.","那一天對我而言成了一種象徵：好好表現，不過就是一步一步走下去。"]],
q:[
["How many people joined?",["Thirty.","Two hundred.","One hundred."],1,"第 3 句。"],
["What did the guide say about the weather?",["It is available to everyone equally.","It is always bad.","It changes fast."],0,"第 6 句。"],
["What did the day become for the writer?",["A symbol.","A fault.","A punishment."],0,"最後一句。"]]},

"L2U50":{t:"The Keeper of the Stream",zt:"守護溪流的人",
c:[["relate to sb","與某人產生共鳴"],["a link between A and B","A 與 B 之間的關聯"],["read aloud","朗讀"],["at one's own expense","自費"]],
p:[
["In a small town, an old *shopkeeper* named Mr. Lu keeps a library beside a clear *stream*.","在一個小鎮上，一位名叫盧先生的老店主在清澈的溪流旁經營一間圖書室。"],

let _mergedPools=null;
function levelOf(u){ const m=(u.id||"").match(/^(?:__ALL_)?L(\d+)/); return m?+m[1]:1; }
function mergedPools(){
  if(!_mergedPools){
    _mergedPools=[];
    const levels=[...new Set(BUILTIN_UNITS.map(levelOf))].sort((a,b)=>a-b);
    levels.forEach(lv=>{
      const us=BUILTIN_UNITS.filter(u=>levelOf(u)===lv);
      const words=[]; us.forEach(u=>u.words.forEach(w=>words.push(w)));
      _mergedPools.push({id:"__ALL_L"+lv+"__", title:"⭐ Level "+lv+" 全部（"+us.length+" 課・"+words.length+" 字）", words, _isAll:true});
    });
  }
  return _mergedPools;
}
/* 動詞三態：從 ph 的「三態 / 三態同形」標記解析出 [原形,過去式,過去分詞] */
function parseForms(w){
  if(w._forms!==undefined)return w._forms;
  let res=null;
  for(const p of (w.ph||[])){
    const tag=(p[1]||"").trim();
    if(tag==="三態"||tag==="三態同形"){
      for(const seg of [p[0], ...p[0].split(/[：]/)]){
        const parts=seg.split(",").map(s=>s.replace(/[（(].*$/,"").replace(/[／/].*$/,"").replace(/[\u4e00-\u9fff]+[：:]/,"").replace(/^[^a-zA-Z]+/,"").trim()).filter(Boolean);
        if(parts.length>=3 && parts[0].toLowerCase().replace(/[^a-z]/g,"")===w.w.toLowerCase()){ res=parts.slice(0,3); break; }
      }
    }
    if(res)break;
  }
  w._forms=res; return res;
}
function formsOf(w){ return parseForms(w); }

/* 動詞三態虛擬單元（彙整所有含三態的動詞） */
let _verbsUnit=null;
function verbsUnit(){
  if(!_verbsUnit){
    const seen=new Set(), words=[];
    BUILTIN_UNITS.forEach(u=>u.words.forEach(w=>{ if(parseForms(w)&&!seen.has(w.w)){seen.add(w.w);words.push(w);} }));
    _verbsUnit={id:"__VERBS__", title:"⚡ 動詞三態（"+words.length+" 字）", words, _isVerbs:true};
  }
  return _verbsUnit;
}

}

/* ===================== 發音（Chrome 防 GC） ===================== */
let _utterRef=null,_wd=null;
function speak(text,lang="en-US",rate){
  if(!("speechSynthesis" in window))return;
  window.speechSynthesis.cancel(); if(_wd){clearInterval(_wd);_wd=null;}
  const u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=rate||.92;
  _utterRef=u;
  u.onend=()=>{_utterRef=null;if(_wd){clearInterval(_wd);_wd=null;}};
  u.onerror=()=>{_utterRef=null;if(_wd){clearInterval(_wd);_wd=null;}};
  window.speechSynthesis.speak(u);
  _wd=setInterval(()=>{if(!window.speechSynthesis.speaking){clearInterval(_wd);_wd=null;return;}window.speechSynthesis.pause();window.speechSynthesis.resume();},4000);
}

const V_DIPH=["aɪ","aʊ","ɔɪ"];
const V_MONO=["i","ɪ","e","ɛ","æ","ɑ","ɔ","o","ʊ","u","ʌ","ə","ɚ","ɝ"];
const V_ORDER=[
 ["i","長音 [i] · see"],["ɪ","短音 [ɪ] · sit"],["e","[e] · cake"],["ɛ","[ɛ] · bed"],["æ","蝴蝶音 [æ] · cat"],
 ["ʌ","[ʌ] · cup"],["ə","輕音 [ə] · about"],["ɝ","捲舌 [ɝ] · bird"],["ɚ","捲舌 [ɚ] · teacher"],
 ["u","[u] · food"],["ʊ","[ʊ] · book"],["o","[o] · go"],["ɔ","[ɔ] · law"],["ɑ","[ɑ] · hot"],
 ["aɪ","雙母音 [aɪ] · my"],["aʊ","雙母音 [aʊ] · now"],["ɔɪ","雙母音 [ɔɪ] · boy"],
 ["l̩","成音節 [l̩] · little"],["n̩","成音節 [n̩] · button"]
];
function _vFirstKK(kk){let s=(kk||"").replace(/[\[\]]/g,"");return s.split(/[\/／]/)[0].replace(/\([^)]*\)/g,"").replace(/\b(n|v|a|adv|adj)\.\s*/g,"").trim();}
function _vNuclei(s){const out=[];let i=0;while(i<s.length){const two=s.slice(i,i+2);if(V_DIPH.includes(two)){out.push({v:two,pos:i});i+=2;continue;}if(two.length===2&&two[1]==="\u0329"){out.push({v:two,pos:i});i+=2;continue;}const one=s[i];if(one==="a"){out.push({v:"ɑ",pos:i});i+=1;continue;}if(V_MONO.includes(one)){out.push({v:one,pos:i});i+=1;continue;}i+=1;}return out;}
function stressVowel(kk){const s=_vFirstKK(kk);const ns=_vNuclei(s);if(!ns.length)return null;let sv=ns[0].v;const sp=s.indexOf("ˈ");if(sp>=0){const af=ns.find(n=>n.pos>sp);if(af)sv=af.v;}return sv;}

let _seq={stop:true,id:0};
function stopSeq(){_seq.stop=true;_seq.id++;try{if("speechSynthesis" in window)speechSynthesis.cancel();}catch(e){}if(_wd){clearInterval(_wd);_wd=null;}}
function playSeq(words,onEach,onDone){
  stopSeq();
  const myId=++_seq.id;_seq.stop=false;let i=0;
  const step=()=>{
    if(_seq.stop||_seq.id!==myId||i>=words.length){if(onDone)onDone();return;}
    const w=words[i];if(onEach)onEach(i,w);i++;
    try{speechSynthesis.cancel();}catch(e){}
    const u=new SpeechSynthesisUtterance(w.w);u.lang="en-US";u.rate=.9;_utterRef=u;
    u.onend=()=>{if(_wd){clearInterval(_wd);_wd=null;}if(!_seq.stop&&_seq.id===myId)setTimeout(step,320);};
    u.onerror=()=>{if(!_seq.stop&&_seq.id===myId)setTimeout(step,320);};
    speechSynthesis.speak(u);
    _wd=setInterval(()=>{if(!speechSynthesis.speaking){clearInterval(_wd);_wd=null;return;}speechSynthesis.pause();speechSynthesis.resume();},4000);
  };
  step();
}

/* 語音導覽：可中英混合、逐段朗讀的序列播放器 */
function tourPlay(steps,onEach,onDone){
  stopSeq();
  const myId=++_seq.id;_seq.stop=false;let i=0;
  const step=()=>{
    if(_seq.stop||_seq.id!==myId||i>=steps.length){if(onDone)onDone(_seq.stop||_seq.id!==myId);return;}
    const s=steps[i];if(onEach)onEach(i,s);i++;
    try{speechSynthesis.cancel();}catch(e){}
    const u=new SpeechSynthesisUtterance(s.t);u.lang=s.lang||"en-US";u.rate=s.rate||.9;_utterRef=u;
    u.onend=()=>{if(_wd){clearInterval(_wd);_wd=null;}if(!_seq.stop&&_seq.id===myId)setTimeout(step,s.gap||360);};
    u.onerror=()=>{if(!_seq.stop&&_seq.id===myId)setTimeout(step,s.gap||360);};
    speechSynthesis.speak(u);
    _wd=setInterval(()=>{if(!speechSynthesis.speaking){clearInterval(_wd);_wd=null;return;}speechSynthesis.pause();speechSynthesis.resume();},4000);
  };
  step();
}

/* 把詞性縮寫唸成中文 */
const POS_SAY={n:"名詞",v:"動詞",vt:"動詞",vi:"動詞",a:"形容詞",adj:"形容詞",adv:"副詞",
  prep:"介系詞",conj:"連接詞",pron:"代名詞",aux:"助動詞",art:"冠詞",int:"感嘆詞"};
function posSpeak(pos){
  const out=[];
  (pos||"").split(/[&,]/).forEach(seg=>{
    const b=seg.replace(/[^a-zA-Z]/g,"").toLowerCase();
    const z=POS_SAY[b];if(z&&!out.includes(z))out.push(z);
  });
  return out.join("、");
}
/* 產生單字卡背面的導覽腳本（英文唸完接中文） */
function buildTour(w){
  const S=[],EN={lang:"en-US",rate:.85},ZH={lang:"zh-TW",rate:.95};
  S.push(Object.assign({t:w.w,sel:"tWord",label:"單字"},EN,{gap:420}));
  const ps=posSpeak(w.pos);
  S.push(Object.assign({t:(ps?ps+"，":"")+String(w.zh).replace(/[；;]/g,"，"),sel:"tDef",label:"詞性與中文"},ZH,{gap:460}));
  (w.ph||[]).forEach((p,i)=>{
    S.push(Object.assign({t:sayable(p[0]),sel:"tPh"+i,label:"片語"},EN));
    S.push(Object.assign({t:p[1],sel:"tPh"+i,label:"片語"},ZH,{gap:400}));
  });
  if(w.rel){
    /* 關聯字：拆成「英文＋中文」逐組唸，避免整串混讀 */
    const MARK=[["延伸","延伸字，"],["用法","用法，"],["衍","衍生字，"],["似","相似字，"],["反","反義字，"],["補","補充，"],["比","比較，"]];
    w.rel.split("‧").map(x=>x.trim()).filter(Boolean).forEach(p=>{
      const en=(p.match(/[A-Za-z][A-Za-z' -]*/g)||[]).join(" ").replace(/\s+/g," ").trim();
      let zh=p.replace(/[A-Za-z][A-Za-z' -]*/g," ").replace(/\s+/g," ").trim();
      for(const [k,v] of MARK){ if(zh.indexOf(k)===0){zh=v+zh.slice(k.length).trim();break;} }
      if(en)S.push(Object.assign({t:en,sel:"tRel",label:"關聯字"},EN,{gap:200}));
      if(zh)S.push(Object.assign({t:zh,sel:"tRel",label:"關聯字"},ZH,{gap:300}));
    });
  }
  (w.ex||[]).forEach((e,i)=>{
    S.push(Object.assign({t:e[0],sel:"tEx"+i,label:"例句"},EN,{gap:300}));
    S.push(Object.assign({t:e[1],sel:"tEx"+i,label:"例句"},ZH,{gap:480}));
  });
  return S;
}

/* 依詞性（pos 欄）判斷所屬大分類，一字可同時歸多類 */
function posCats(pos){
  const cats=new Set();
  (pos||"").split(/[&,]/).forEach(seg=>{
    const b=seg.replace(/[^a-zA-Z]/g,"").toLowerCase();
    if(!b)return;
    if(b[0]==="v")cats.add("動詞");
    else if(b==="n")cats.add("名詞");
    else if(b==="a")cats.add("形容詞");
  });
  return cats;
}
const POS_GROUPS=[["名詞","🟦"],["動詞","🟩"],["形容詞","🟧"],["其他","⬜"]];
function renderPosView(area,filter){
  stopSeq();
  const f=(filter||"").trim().toLowerCase(), raw=(filter||"").trim();
  const ws=activeUnit().words.filter(w=>!f||w.w.toLowerCase().includes(f)||(w.kk||"").toLowerCase().includes(f)||w.zh.includes(raw));
  if(!ws.length){area.innerHTML=`<div class="empty"><div class="big">🔍</div>找不到符合「${esc(filter)}」的單字</div>`;return;}
  const bucket={"名詞":[],"動詞":[],"形容詞":[],"其他":[]};
  ws.forEach(w=>{const cats=posCats(w.pos);if(cats.size===0)bucket["其他"].push(w);else cats.forEach(c=>bucket[c].push(w));});
  const groups=POS_GROUPS.filter(([g])=>bucket[g].length);
  const multi=ws.some(w=>posCats(w.pos).size>1);
  const note=`依詞性分成 ${groups.length} 類，共 ${ws.length} 字。`+(multi?"具多重詞性的單字（如 n. & vt.）會同時出現在對應的分類中。":"");
  area.innerHTML=`<div class="sub" style="margin-bottom:10px">${note}</div>`+
    groups.map(([g,ico])=>`
      <div class="pos-group">
        <div class="pos-ghead"><span class="pos-gname">${ico} ${g}</span><span class="pos-gcount">${bucket[g].length} 字</span></div>
        ${bucket[g].map(w=>listRowHtml(w)).join("")}
      </div>`).join("");
  bindListRows(area);
}

function firstExOf(en){const w=activeUnit().words.find(x=>x.w===en);return (w&&w.ex&&w.ex.length)?w.ex[0]:null;}
function makeItems(scope){
  const words=activeUnit().words.map(w=>({type:"word",en:w.w,zh:shortZh(w),full:w.zh,kk:w.kk}));
  const phr=phraseBank().map(p=>({type:"phrase",en:p.en,zh:p.zh,full:p.zh}));
  if(scope==="word")return words;
  if(scope==="phrase")return phr;
  return words.concat(phr);
}
function escapeRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function wordForms(w){
  const f=[w,w+"s",w+"es",w+"ed",w+"d",w+"ing"];
  if(/y$/i.test(w)){f.push(w.slice(0,-1)+"ies",w.slice(0,-1)+"ied");}
  if(/e$/i.test(w)){f.push(w.slice(0,-1)+"ing");}
  if(/[^aeiou][aeiou][^aeiouwxy]$/i.test(w)){const c=w.slice(-1);f.push(w+c+"ed",w+c+"ing");}
  return f.sort((a,b)=>b.length-a.length);
}
function makeClozeItems(){
  const out=[];
  activeUnit().words.forEach(w=>{
    (w.ex||[]).forEach(e=>{
      for(const f of wordForms(w.w)){
        const re=new RegExp("\\b"+escapeRe(f)+"\\b","i");
        const m=e[0].match(re);
        if(m){out.push({type:"cloze",en:w.w,zh:shortZh(w),full:w.zh,kk:w.kk,ansForm:m[0],sen:e[0].replace(re,"＿＿＿"),senFull:e[0],senZh:e[1]});return;}
      }
    });
  });
  const cnt={},res=[];
  shuffle(out).forEach(it=>{cnt[it.en]=(cnt[it.en]||0)+1;if(cnt[it.en]<=2)res.push(it);});
  return res;
}

    else {mode="choice";pool=MIS().map(m=>({type:m.type==="forms"?"word":m.type,en:m.en,zh:m.zh,full:m.zh}));}
  }

  else if(mode==="spell"||mode==="listen")pool=makeItems("word");

    const bonus=comboBonus(q.combo), gain=10+bonus;
    q.points=(q.points||0)+gain;

  }else{
    q.combo=0;
    q.wrong.push(Object.assign({},item,{picked:picked||""}));addMistake(item,picked);

  const fill=document.getElementById("gFill");if(fill)fill.style.width=pct+"%";
  const frac=document.getElementById("gFrac");if(frac)frac.textContent=done+"/"+total;
  const pts=document.getElementById("gPts");if(pts)pts.textContent=(q.points||0)+" XP";
  const cb=document.getElementById("gCombo");
  if(cb){cb.textContent="🔥 連對 "+(q.combo||0);
    if(correct&&q.combo>=2){cb.classList.remove("hot");void cb.offsetWidth;cb.classList.add("hot");}}

  if(tro&&correct){tro.classList.remove("pulse");void tro.offsetWidth;tro.classList.add("pulse");}
  /* 里程碑星星點亮 */
  const before=(q.pos/total), after=done/total;

/* ---------- 逐塊播放（自動語塊切分） ---------- */
const CHUNK_BREAKERS=new Set(["at","in","on","to","for","with","from","by","of","about","into","onto","over","under","after","before","because","when","while","that","which","who","whose","whom","and","or","but","so","if","as","than","since","during","without","until","unless","although","though","where","how","why","whether"]);
function chunkSentence(en){
  const words=en.replace(/\s+/g," ").trim().split(" ").filter(Boolean);
  const chunks=[];let cur=[];
  const push=()=>{if(cur.length){chunks.push(cur.join(" "));cur=[];}};
  words.forEach(w=>{
    const n=norm(w);
    if(cur.length>=2&&(CHUNK_BREAKERS.has(n)||cur.length>=5))push();
    cur.push(w);
    if(/[,;:!?—]$/.test(w))push();
  });
  push();
  for(let i=chunks.length-1;i>0;i--){
    if(chunks[i].split(" ").length===1&&!/[,;:!?—]$/.test(chunks[i-1])){chunks[i-1]+=" "+chunks[i];chunks.splice(i,1);}
  }
  return chunks;
}
let chunkPlaying=false,chunkTimer=null,curChunks=null;
function stopChunks(){
  if(chunkTimer){clearTimeout(chunkTimer);chunkTimer=null;}
  const was=chunkPlaying;chunkPlaying=false;
  if(was&&("speechSynthesis" in window))window.speechSynthesis.cancel();
  const st=document.getElementById("spChunks");if(st)st.querySelectorAll(".ck").forEach(x=>x.classList.remove("now"));
  const b=document.getElementById("spChunkBtn");if(b){b.classList.remove("playing");b.textContent="🧩 逐塊播放";}
}
function speakChunk(text,done){
  if(!("speechSynthesis" in window)){if(done)done();return;}
  window.speechSynthesis.cancel();if(_wd){clearInterval(_wd);_wd=null;}
  const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.8;
  u.onend=()=>{if(done)done();};u.onerror=()=>{if(done)done();};
  window.speechSynthesis.speak(u);
}
function renderChunkStrip(chunks){
  const el=document.getElementById("spChunks");if(!el)return;
  el.innerHTML=chunks.map((c,i)=>`<button class="ck" data-i="${i}">${spRevealed?esc(c):"●".repeat(Math.min(c.split(" ").length,5))}</button>`).join("");
  el.classList.add("show");
  el.querySelectorAll(".ck").forEach(x=>x.onclick=()=>{
    stopChunks();
    el.querySelectorAll(".ck").forEach(y=>y.classList.remove("now"));
    x.classList.add("now");

  });
}
function highlightChunk(i){

function playChunks(s){
  if(chunkPlaying){stopChunks();return;}
  curChunks=chunkSentence(s.en);
  renderChunkStrip(curChunks);
  chunkPlaying=true;
  const btn=document.getElementById("spChunkBtn");if(btn){btn.classList.add("playing");btn.textContent="⏹ 停止";}
  let i=0;
  const step=()=>{
    if(!chunkPlaying)return;
    if(i>=curChunks.length){stopChunks();return;}
    highlightChunk(i);
    speakChunk(curChunks[i],()=>{if(!chunkPlaying)return;chunkTimer=setTimeout(()=>{i++;step();},420);});
  };
  step();
}
async function toggleRec(s){

  try{

  // SpeechRecognition（比對）：行動裝置上會與錄音互搶麥克風導致錄音失敗，故僅桌機同時啟用

      recognizer.onerror=()=>{};
      recognizer.onend=()=>{if(recActive)finishRec(s);};

}

function norm(str){return (str||"").toLowerCase().replace(/[^a-z0-9'\s]/g," ").replace(/\s+/g," ").trim();}
/* 冠詞：不計分 ‧ 弱讀功能詞：低權重 ‧ 其餘＝內容字（重音字）：滿權重 */
const ARTICLES=new Set(["a","an","the"]);
const WEAK=new Set([
 "is","am","are","was","were","be","been","being","do","does","did","have","has","had",
 "will","would","shall","should","can","could","may","might","must","ll","ve","re","d","m","s","t",
 "i","you","he","she","it","we","they","me","him","her","us","them","my","your","his","its","our","their",
 "this","that","these","those","who","whom","whose","which","what","there","here",
 "of","to","in","on","at","by","for","with","from","into","onto","off","up","out","over","about","as","than",
 "and","or","but","so","if","then","because","when","while","after","before","at",
 "it's","he's","she's","that's","there's","i'm","you're","we're","they're","i'll","you'll","we'll","i've","you've","we've","i'd"
]);
function wordWeight(w){ if(ARTICLES.has(w))return 0; if(WEAK.has(w))return 0.4; return 1; }
function isStressed(w){ return !ARTICLES.has(w) && !WEAK.has(w); }
/* 把英文句切成帶有 重音/弱讀/冠詞 樣式的 span；可選傳入 said 集合上 命中/未中 標記 */
function renderTargetSpans(en,said){
  const parts=en.replace(/\s+/g," ").trim().split(" ");
  return parts.map(p=>{
    const n=norm(p), art=ARTICLES.has(n), weak=!art&&WEAK.has(n), stress=!art&&!weak;
    let cls=art?"article":(stress?"stress":"weak");
    if(said) cls+= said.has(n)?" hit":" miss";
    return `<span class="tw ${cls}">${esc(p)}</span>`;
  }).join(" ");
}
function scoreAndShow(s){
  const box=document.getElementById("spScore");if(!box)return;
  const tw=norm(s.en).split(" ").filter(Boolean);
  const said=new Set(norm(lastTranscript).split(" ").filter(Boolean));
  if(!lastTranscript){
    const srUsable=(("webkitSpeechRecognition" in window)||("SpeechRecognition" in window))&&!IS_MOBILE;
    box.className="sp-score show "+(srUsable?"low":"mid");
    box.innerHTML=srUsable
      ?`<div class="big">—</div><div class="sp-heard">沒有辨識到語音。請確認已允許麥克風後再試一次。</div>`
      :`<div class="big">🎧</div><div class="sp-heard">錄音完成！按「▶ 我的錄音」與「🔊 範例」交互聆聽，比對自己的發音。</div>`;
    return;}
  // 加權計分：冠詞權重 0、弱讀詞 0.4、重音字 1
  let totalW=0,hitW=0,totStress=0,hitStress=0;
  tw.forEach(w=>{const wt=wordWeight(w);totalW+=wt;if(said.has(w))hitW+=wt;
    if(isStressed(w)){totStress++;if(said.has(w))hitStress++;}});
  const pct=totalW>0?Math.round(hitW/totalW*100):100;
  // 逐字標記（含重音/弱讀/冠詞樣式 + 命中/未中）
  const tgt=document.getElementById("spTarget");if(tgt){spRevealed=true;tgt.classList.remove("hidden");tgt.innerHTML=renderTargetSpans(s.en,said);}
  const cls=pct>=80?"good":pct>=50?"mid":"low";
  box.className="sp-score show "+cls;
  box.innerHTML=`<div class="big">${pct}<span style="font-size:1.1rem">%</span></div>
    <div class="sp-heard">重音字念對 <b>${hitStress} / ${totStress}</b>　（冠詞 a · the 不計分）<br>辨識結果：<b class="en">${esc(lastTranscript)||"（無）"}</b></div>`;
}

let _widx=null;
function widx(){
  if(!_widx){ _widx={}; BUILTIN_UNITS.forEach(u=>u.words.forEach(w=>{
      const rec={w:w.w,kk:w.kk,zh:w.zh};
      [String(w.w).toLowerCase(), String(w.id||"").toLowerCase(), rdNorm(w.w)].forEach(k=>{ if(k&&!_widx[k])_widx[k]=rec; });
    })); }
  return _widx;
}
const RD_IRREG={took:"take",gave:"give",told:"tell",felt:"feel",began:"begin",met:"meet",sat:"sit",heard:"hear",forgot:"forget",forgotten:"forget",fell:"fall",fallen:"fall",drove:"drive",lay:"lie",rose:"rise",flew:"fly",sang:"sing",knew:"know",known:"know",sent:"send",dug:"dig",rang:"ring",understood:"understand",spent:"spend",lent:"lend",bent:"bend",laid:"lay",made:"make",went:"go",gone:"go",ran:"run",came:"come",saw:"see",seen:"see",said:"say",kept:"keep",held:"hold",brought:"bring",bought:"buy",thought:"think",caught:"catch",taught:"teach",left:"leave",lost:"lose",won:"win",wrote:"write",written:"write",spoke:"speak",broke:"break",chose:"choose",grew:"grow",drew:"draw",threw:"throw",found:"find",stood:"stand",swam:"swim",slid:"slide",swept:"sweep",tore:"tear",stuck:"stick",wore:"wear",woke:"wake",struck:"strike",shot:"shoot",fed:"feed",hid:"hide",bit:"bite",sold:"sell",paid:"pay",feet:"foot",teeth:"tooth",men:"man",women:"woman",children:"child",people:"person",lives:"life",leaves:"leaf",knives:"knife",wolves:"wolf",shelves:"shelf",thieves:"thief",mice:"mouse",photo:"photograph",photos:"photograph",fries:"fry",begun:"begin",risen:"rise",flown:"fly",sung:"sing",drawn:"draw",thrown:"throw",worn:"wear",torn:"tear",swum:"swim",eaten:"eat",drunk:"drink",bathed:"bathe"};
function rdNorm(t){
  return String(t).replace(/&#39;/g,"'").replace(/[\u00e9\u00e8\u00ea]/g,"e").replace(/[\u00e1\u00e0\u00e2]/g,"a")
    .toLowerCase().replace(/[^a-z'\-. ]/g,"").replace(/\s+/g," ").trim();
}
function rdBase(n){
  const idx=widx();
  if(!n)return null;
  if(idx[n])return idx[n];
  if(RD_IRREG[n]&&idx[RD_IRREG[n]])return idx[RD_IRREG[n]];
  const c=[n.replace(/\.$/,""),n.replace(/men$/,"man"),n.replace(/ies$/,"y"),n.replace(/ied$/,"y"),n.replace(/es$/,""),
    n.replace(/s$/,""),n.replace(/ed$/,""),n.replace(/ed$/,"e"),n.replace(/ing$/,""),n.replace(/ing$/,"e"),
    n.replace(/([a-z])\1(ed|ing)$/,"$1"),n.replace(/est$/,""),n.replace(/ier$/,"y"),n.replace(/er$/,""),
    n.replace(/ly$/,""),n.replace(/ence$/,"ent"),n.replace(/ance$/,"ant")];
  for(const x of c){ if(x&&x!==n&&idx[x])return idx[x]; }
  return null;
}
function lookupWord(raw){
  const n=rdNorm(raw);
  if(!n)return null;
  const hit=rdBase(n);
  if(hit)return hit;
  if(n.indexOf(" ")>0){ // 片語：取最長的實詞
    const parts=n.split(" ").slice().sort((a,b)=>b.length-a.length);
    for(const w of parts){ const h=rdBase(w); if(h)return h; }
  }
  if(n.indexOf("-")>0){ for(const w of n.split("-")){ const h=rdBase(w); if(h)return h; } }
  return null;
}

  document.getElementById("rdZh").onclick=()=>{ readZh=!readZh; document.getElementById("rdText").classList.toggle("zh",readZh); document.getElementById("rdZh").classList.toggle("on",readZh); };
  document.getElementById("rdSlow").onclick=()=>{ readSlow=!readSlow; document.getElementById("rdSlow").classList.toggle("on",readSlow); };
  document.getElementById("rdSwap").onclick=()=>{ stopSeq(); readPlaying=false; renderReadPicker(document.getElementById("readArea"),"選一篇短文，在語境中重複遇見單字"); };
  const ag=document.getElementById("rdAgain");
  if(ag)ag.onclick=()=>{ readState={rid:rid,ans:{},score:0,done:false}; renderRead(); };
  // 測驗
  document.querySelectorAll(".rq .opt").forEach(b=>{
    b.onclick=()=>{
      const qi=+b.dataset.q, oi=+b.dataset.o;
      if(readState.ans[qi]!==undefined)return;
      readState.ans[qi]=oi;
      renderRead();
      const done=Object.keys(readState.ans).length===R.q.length;
      if(done)rdFinish(rid);
    };
  });
}
function rdSetPlayBtn(){
  const pb=document.getElementById("rdPlay");
  if(!pb)return;
  pb.classList.toggle("on",readPlaying);
  pb.textContent=readPlaying?"⏹ 停止朗讀":"▶︎ 朗讀全文";
}
function rdFinish(rid){
  const R=READINGS[rid],st=readState;
  const score=Object.keys(st.ans).filter(k=>st.ans[k]===R.q[k][2]).length;
  const r=RD(); const old=r[rid]||{};
  r[rid]={done:true,total:R.q.length,best:Math.max(score,old.best||0),last:todayKey(),times:(old.times||0)+1};
  save(); creditActivity("quiz");
  addStars(STAR_RULES.read+(score===R.q.length?STAR_RULES.readPerfect:0),score===R.q.length?"短文全對":"讀完短文");
  setTimeout(()=>{aeroReact(score===R.q.length?"perfect":"read");aeroCheckLevel();},700);
  if(score===R.q.length)rdTip("🎉 全對！這篇短文的語境你已經掌握了");
}

function AE(){ if(!DB.aero)DB.aero={met:false,talks:0,lastTip:""}; return DB.aero; }
function aeroLevel(){
  const days=(DB.checkin.days||[]).length;
  let known=0; Object.values(DB.units||{}).forEach(u=>{ known+=Object.values(u.progress||{}).filter(v=>v==="known").length; });
  const reads=Object.keys(DB.readings||{}).length;
  const pts=days*8+known+reads*4;
  const lv=Math.max(1,Math.floor(Math.sqrt(pts/6))+1);
  const cur=(lv-1)*(lv-1)*6, next=lv*lv*6;
  return {lv:lv,pts:pts,pct:Math.min(100,Math.round((pts-cur)/Math.max(1,next-cur)*100)),known:known,days:days,reads:reads};
}

function aeroRadar(){
  const t=DB.checkin.tasks||{};
  const ws=activeUnit().words, known=ws.filter(w=>PROG()[w.id]==="known").length;
  const qlog=QLOG().slice(-10);
  const acc=qlog.length?Math.round(qlog.reduce((a,x)=>a+x.score/x.total,0)/qlog.length*100):0;
  const rd=DB.readings||{}, rdone=Object.keys(rd).filter(k=>rd[k].done).length;
  const V=[
    ["單字量",Math.min(100,Math.round(known/Math.max(1,ws.length)*100))],
    ["測驗力",acc],
    ["聽說量",Math.min(100,(t.speak||0)*20)],
    ["閱讀量",Math.min(100,Math.round(rdone/50*100))],
    ["持續力",Math.min(100,displayStreak()*14)]
  ];
  const cx=110,cy=100,R=68,n=V.length;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r];};
  let grid="";
  [.25,.5,.75,1].forEach(f=>{ grid+=`<polygon points="${V.map((_,i)=>pt(i,R*f).join(",")).join(" ")}" fill="none" stroke="var(--mist-2)" stroke-width="1"/>`; });
  V.forEach((_,i)=>{const p=pt(i,R);grid+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="var(--mist-2)" stroke-width="1"/>`;});
  const poly=V.map((v,i)=>pt(i,R*Math.max(.06,v[1]/100)).join(",")).join(" ");
  const dots=V.map((v,i)=>{const p=pt(i,R*Math.max(.06,v[1]/100));return `<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="var(--aero)"/>`;}).join("");
  const labs=V.map((v,i)=>{const p=pt(i,R+17);return `<text x="${p[0]}" y="${p[1]}" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="700" fill="var(--muted)">${v[0]} ${v[1]}</text>`;}).join("");
  return `<svg viewBox="0 0 220 200" width="100%" style="max-width:290px;display:block;margin:0 auto">
    ${grid}<polygon points="${poly}" fill="rgba(63,182,224,.28)" stroke="var(--aero)" stroke-width="2"/>${dots}${labs}</svg>`;
}

let _awardQueue=[];
function checkAwards(){
  const r=RW(); let got=[];
  AWARDS.forEach(a=>{
    if(r.cards[a.id])return;
    let ok=false; try{ok=!!a.f();}catch(e){}
    if(ok){ r.cards[a.id]={at:todayKey()}; got.push(a); }
  });
  if(got.length){
    r.stars=(r.stars||0)+got.reduce((x,a)=>x+a.r*10,0);
    r.total=(r.total||0)+got.reduce((x,a)=>x+a.r*10,0);
    save(); renderStarHud();
    _awardQueue=_awardQueue.concat(got);
    showNextAward();
  }
}

/* ===================== 錯題診斷 ===================== */
function allMistakes(){
  const out=[];
  Object.entries(DB.units||{}).forEach(([uidk,st])=>{
    (st.mistakes||[]).forEach(m=>out.push(Object.assign({unit:uidk},m)));
  });
  return out;
}
const POS_LAB={"n.":"名詞","v.":"動詞","vt.":"動詞","vi.":"動詞","a.":"形容詞","adj.":"形容詞","adv.":"副詞",
  "prep.":"介系詞","conj.":"連接詞","pron.":"代名詞","art.":"冠詞","int.":"感嘆詞","aux.":"助動詞"};
function posOf(en){
  const w=lookupWordFull(en);
  if(!w||!w.pos)return "未分類";
  const first=String(w.pos).split("&")[0].trim();
  return POS_LAB[first]||first;
}
let _pidx=null;
function lookupWordFull(en){
  if(!_pidx){ _pidx={}; BUILTIN_UNITS.forEach(u=>u.words.forEach(w=>{ const k=String(w.w).toLowerCase(); if(!_pidx[k])_pidx[k]=w; })); }
  return _pidx[String(en).toLowerCase().trim()]||null;
}
function misAnalysis(scope){
  const list=scope==="all"?allMistakes():MIS().map(m=>Object.assign({unit:uid()},m));
  const modeLab={choice:"選擇",spell:"拼字",listen:"聽力",cloze:"填空",forms:"三態"};
  const byMode={},byPos={},byUnit={}; let sum=0;
  list.forEach(m=>{
    const mm=m.modes||{choice:m.miss||1};
    Object.entries(mm).forEach(([k,v])=>{ byMode[modeLab[k]||k]=(byMode[modeLab[k]||k]||0)+v; sum+=v; });
    const p=m.type==="phrase"?"片語":posOf(m.en);
    byPos[p]=(byPos[p]||0)+(m.miss||1);
    byUnit[m.unit]=(byUnit[m.unit]||0)+(m.miss||1);
  });
  // 近 7 日新增
  const days=[];
  for(let i=6;i>=0;i--){ const k=dayKeyOffset(-i); days.push([k,list.filter(m=>m.last===k).length]); }
  const top=list.slice().sort((a,b)=>(b.miss||1)-(a.miss||1)).slice(0,5);
  return {list:list,byMode:byMode,byPos:byPos,byUnit:byUnit,sum:sum,days:days,top:top};
}
function barRows(obj,unitLab){
  const rows=Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if(!rows.length)return "";
  const max=rows[0][1]||1;
  return `<div class="analysis">${rows.map(([k,v])=>
    `<div class="an-row"><span class="an-lab">${esc(k)}</span><div class="an-track"><i style="width:${Math.round(v/max*100)}%"></i></div><span class="an-val">${v} ${unitLab||"次"}</span></div>`).join("")}</div>`;
}
function misDiagnosis(A){
  if(!A.list.length)return {txt:"目前沒有錯題紀錄。保持這個節奏，Aero 幫你把新字排進複習隊列 ✨",mood:"cheer",act:null};
  const m=Object.entries(A.byMode).sort((a,b)=>b[1]-a[1])[0];
  const p=Object.entries(A.byPos).sort((a,b)=>b[1]-a[1])[0];
  const tips={
    "拼字":"錯最多的是<b>拼字題</b>——代表你「認得出來、寫不出來」。建議用單字卡的<b>音節拆解</b>先唸出來再拼，字形自然會跟上。",
    "聽力":"錯最多的是<b>聽力拼字</b>——問題多半出在<b>音素辨識</b>。到「聽說」頁用慢速跟讀，特別注意字尾子音。",
    "選擇":"錯最多的是<b>選擇題</b>——這是<b>語意混淆</b>。到「閱讀」頁看該字在短文裡怎麼用，語境會幫你分開近義字。",
    "填空":"錯最多的是<b>例句填空</b>——你懂字義但不熟<b>搭配詞</b>。先背短文上方的搭配詞焦點，再回來挑戰。",
    "三態":"錯最多的是<b>動詞三態</b>——建議用「三態複習」連續練，把不規則變化整組記起來。"
  };
  const txt=`累計答錯 <b>${A.sum}</b> 次，共 <b>${A.list.length}</b> 個項目。${tips[m[0]]||""}${p?`<br>詞性上最常卡關的是 <b>${p[0]}</b>（${p[1]} 次）。`:""}`;
  return {txt:txt,mood:"think",act:m[0]};
}
function misAnalysisHtml(scope){
  const A=misAnalysis(scope);
  const D=misDiagnosis(A);
  const maxDay=Math.max(1,...A.days.map(d=>d[1]));
  const trend=A.days.map(d=>`<div class="mday" title="${d[0]}：${d[1]} 題"><i style="height:${Math.max(4,Math.round(d[1]/maxDay*100))}%"></i><span>${d[0].slice(8)}</span></div>`).join("");
  const topHtml=A.top.map((m,i)=>{
    const picks=m.picks?Object.entries(m.picks).sort((a,b)=>b[1]-a[1])[0]:null;
    return `<div class="wk-row"><span class="wk-i">${i+1}</span><span class="wk-w en">${esc(m.en)}</span><span class="wk-z">${esc(m.zh)}</span><span class="wk-n">錯 ${m.miss||1} 次</span>${picks?`<span class="wk-p">易混：${esc(picks[0])}</span>`:""}</div>`;
  }).join("");
  return `<div class="diag">
      <div class="dg-art">${AERO(D.mood,74,"glass")}</div>
      <div class="dg-txt">${D.txt}</div>
    </div>
    <div class="seg" id="misScope" style="margin:12px 0 4px">
      <button data-v="unit" class="${scope==="unit"?"sel":""}">本單元</button>
      <button data-v="all" class="${scope==="all"?"sel":""}">全部單元</button>
    </div>
    ${A.list.length?`
    <h3 style="font-size:.88rem;margin-top:14px">依題型分布</h3>${barRows(A.byMode)}
    <h3 style="font-size:.88rem;margin-top:14px">依詞性分布</h3>${barRows(A.byPos)}
    ${scope==="all"?`<h3 style="font-size:.88rem;margin-top:14px">依單元分布</h3>${barRows(Object.fromEntries(Object.entries(A.byUnit).map(([k,v])=>[k.replace("L","Level ").replace("U","-U"),v])),"次")}`:""}
    <h3 style="font-size:.88rem;margin-top:14px">近 7 日新增錯題</h3>
    <div class="mtrend">${trend}</div>
    <h3 style="font-size:.88rem;margin-top:14px">最需要加強的 5 個</h3>
    <div class="wk-list">${topHtml}</div>`:`<div class="sub" style="padding:8px 0">目前沒有錯題，繼續保持！</div>`}`;
}

/* ===================== App（PWA）模式 ===================== */
(function(){
  const sp=document.getElementById("splashArt");
  if(sp)sp.innerHTML=AERO("cheer",118,"star");
  setTimeout(()=>{const s=document.getElementById("splash");if(s)s.classList.add("hide");setTimeout(()=>{if(s)s.remove();},600);},900);

  // Service Worker：離線可用
  if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
    window.addEventListener("load",()=>{
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  }

  // 連線狀態
  const bar=document.getElementById("offlineBar");
  const sync=()=>{ if(bar)bar.classList.toggle("show",!navigator.onLine); };
  window.addEventListener("online",()=>{sync();aeroSay("網路回來了 ⚡","happy",2600);});
  window.addEventListener("offline",()=>{sync();aeroSay("沒網路也沒關係，我們照樣練！📴","happy",3400);});
  sync();

  // 安裝提示
  const chip=document.createElement("button");
  chip.className="install-chip"; chip.id="installChip";
  chip.innerHTML=`📲 把 Aero 裝進主畫面<span class="x" id="installX">✕</span>`;
  document.body.appendChild(chip);
  const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
  let deferred=null;
  const dismissed=()=>localStorage.getItem("aeroInstallHide")==="1";

  window.addEventListener("beforeinstallprompt",e=>{
    e.preventDefault(); deferred=e;
    if(!standalone&&!dismissed())setTimeout(()=>chip.classList.add("show"),2600);
  });
  if(isIOS&&!standalone&&!dismissed())setTimeout(()=>chip.classList.add("show"),3200);

  document.getElementById("installX").onclick=e=>{
    e.stopPropagation(); chip.classList.remove("show"); localStorage.setItem("aeroInstallHide","1");
  };
  chip.onclick=async()=>{
    if(deferred){ chip.classList.remove("show"); deferred.prompt();
      const r=await deferred.userChoice; deferred=null;
      if(r&&r.outcome==="accepted")setTimeout(()=>aeroSay("裝好了！以後從主畫面點我就能開始 🚀","cheer",4200),800);
      return;
    }
    showIOSGuide();
  };
  window.addEventListener("appinstalled",()=>{ chip.classList.remove("show"); localStorage.setItem("aeroInstallHide","1"); });

  window.showIOSGuide=function(){
    const m=document.getElementById("aeroModal");
    if(!m)return;
    m.classList.add("show");
    m.querySelector(".ai-art").innerHTML=AERO("happy",108,"star");
    m.querySelector(".ai-text").innerHTML=`<div class="ios-steps"><b>把 Aero 加到主畫面：</b>
      <ol style="margin:6px 0 0 18px">
        <li>點瀏覽器下方的<b>「分享」</b>圖示 <b>⬆️</b></li>
        <li>往下找到<b>「加入主畫面」</b></li>
        <li>按<b>「新增」</b>，就有 App 圖示了 🎉</li>
      </ol></div>`;
    m.querySelector(".ai-dots").innerHTML="";
    m.querySelector("#aiNext").textContent="知道了";
    m.querySelector("#aiNext").onclick=()=>m.classList.remove("show");
    m.querySelector("#aiReplay").onclick=()=>speak("點分享圖示，再選加入主畫面。","zh-TW",1);
    m.querySelector("#aiSkip").onclick=()=>m.classList.remove("show");
  };

  // 由網址片段直接開對應分頁（配合 App 捷徑）
  const h=(location.hash||"").replace("#","");
  if(["card","list","quiz","read","speak","me"].includes(h)){
    const b=document.querySelector('.tab[data-tab="'+h+'"]'); if(b)b.click();
  }
})();
</script>
</body>
</html>
